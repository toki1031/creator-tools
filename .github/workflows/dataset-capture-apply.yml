name: Dataset Capture Apply

on:
  push:
    branches: [dataset-capture-v0-1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dataset-capture-v0-1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted integration
        run: node scripts/apply_dataset_capture_v0_1.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js projectBackup.js
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Connect Dataset Capture v0.1 to scene ordering"
          git push origin HEAD:dataset-capture-v0-1
