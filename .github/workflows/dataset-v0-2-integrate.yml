name: Dataset v0.2 integration temporary

on:
  push:
    branches:
      - dataset-capture-v0-2-duration
    paths:
      - '.github/workflows/dataset-v0-2-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Apply Dataset Capture v0.2 changes
        run: python3 scripts/integrate_dataset_v0_2.py
      - name: Run regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Remove temporary integration files
        run: rm -f scripts/integrate_dataset_v0_2.py .github/workflows/dataset-v0-2-integrate.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Dataset Capture v0.2 for scene duration"
          git push
