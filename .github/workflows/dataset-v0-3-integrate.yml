name: Dataset v0.3 integration temporary
on:
  push:
    branches: [dataset-capture-v0-3-subtitles]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dataset-capture-v0-3-subtitles
      - name: Apply Dataset v0.3 changes
        env:
          HELPER_B64: 
          REPL_B64: 
          TESTS_B64: 
          DOCS_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os, re

          helper = base64.b64decode(os.environ['HELPER_B64']).decode()
          replacement = base64.b64decode(os.environ['REPL_B64']).decode()
          tests_append = base64.b64decode(os.environ['TESTS_B64']).decode()
          docs = base64.b64decode(os.environ['DOCS_B64']).decode()

          decision = Path('decisionLog.js')
          text = decision.read_text()
          if 'recordSubtitleContentChange' not in text:
              marker = '\nexport function moveSceneWithDecision(project, index, direction, options = {}) {'
              if marker not in text:
                  raise SystemExit('decisionLog insertion marker not found')
              text = text.replace(marker, helper + marker)
              decision.write_text(text)

          main = Path('main.js')
          text = main.read_text()
          old_import = 'import { ensureLearningState, moveSceneWithDecision, recordSceneDurationChange } from "./decisionLog.js";'
          new_import = 'import { ensureLearningState, moveSceneWithDecision, recordSceneDurationChange, recordSubtitleContentChange } from "./decisionLog.js";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('main.js decisionLog import marker not found')
          if 'subtitleBeforeByElement' not in text:
              pattern = re.compile(r"    list\.querySelectorAll\('\[data-sub-text\]'\)\.forEach\(el=>el\.oninput=.*?\n    list\.querySelectorAll\('\[data-sub-enabled\]'\)", re.S)
              text, count = pattern.subn(lambda match: replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'main.js subtitle handler replacement count={count}')
          main.write_text(text)

          tests = Path('tests/decisionLog.test.mjs')
          text = tests.read_text()
          if 'recordSubtitleContentChange,' not in text:
              text = text.replace('  recordSceneOrderChange,\n', '  recordSceneOrderChange,\n  recordSubtitleContentChange,\n', 1)
          if "subtitle-content stores one committed edit" not in text:
              text += tests_append
          tests.write_text(text)

          Path('docs/DATASET_CAPTURE_V0_3.md').write_text(docs)
          Path('.github/workflows/dataset-v0-3-integrate.yml').unlink()
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture committed subtitle content decisions"
          git push origin HEAD:dataset-capture-v0-3-subtitles
