name: Issue 29 integrate subtitle scene sync

on:
  push:
    branches:
      - issue29-subtitle-scene-sync

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue29-subtitle-scene-sync
      - name: Patch main.js safely
        env:
          OLD_IMPORT: 'aW1wb3J0IHsgYXBwbHlEaWN0aW9uYXJ5RW50cmllcywgc3BsaXRJbnRvU2NlbmVzLCBzcGxpdFN1YnRpdGxlQ2FyZHMgfSBmcm9tICIuL3F1YWxpdHlMb2dpYy5qcyI7'
          NEW_IMPORT: 'aW1wb3J0IHsgYXBwbHlEaWN0aW9uYXJ5RW50cmllcywgbm9ybWFsaXplU3VidGl0bGVDb250ZW50Rm9yU3luYywgc3BsaXRJbnRvU2NlbmVzLCBzcGxpdFN1YnRpdGxlQ2FyZHMsIHN1YnRpdGxlQ29udGVudENoYW5nZWQgfSBmcm9tICIuL3F1YWxpdHlMb2dpYy5qcyI7'
          ANCHOR: 'Y29uc3QgZmluYWxSZXZpZXdTaWduYXR1cmUgPSBwcm9qZWN0ID0+IHs='
          INSERT: ''
          OLD_BLUR: ''
          NEW_BLUR: ''
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          path = Path('main.js')
          text = path.read_text()
          def decoded(name):
              return base64.b64decode(os.environ[name]).decode()
          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return source.replace(old, new, 1)

          text = replace_once(text, decoded('OLD_IMPORT'), decoded('NEW_IMPORT'), 'qualityLogic import')
          text = replace_once(text, decoded('ANCHOR'), decoded('INSERT'), 'dialog insertion anchor')
          text = replace_once(text, decoded('OLD_BLUR'), decoded('NEW_BLUR'), 'subtitle blur handler')
          path.write_text(text)
          PY
      - name: Remove temporary workflow and commit integration
        run: |
          rm .github/workflows/issue29-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js .github/workflows/issue29-integrate.yml
          git commit -m 'Add optional subtitle to scene text sync'
          git push
