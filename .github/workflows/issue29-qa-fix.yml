name: Issue 29 QA fix

on:
  push:
    branches:
      - issue29-subtitle-scene-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue29-subtitle-scene-sync
      - name: Apply QA fix
        env:
          OLD_BLUR: ''
          NEW_BLUR: ''
          TEST_ANCHOR: ''
          TEST_INSERT: ''
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          def dec(name):
              return base64.b64decode(os.environ[name]).decode()

          main = Path('main.js')
          text = main.read_text()
          old = dec('OLD_BLUR')
          new = dec('NEW_BLUR')
          if text.count(old) != 1:
              raise SystemExit(f'main blur match count={text.count(old)}')
          main.write_text(text.replace(old, new, 1))

          tests = Path('tests/decisionLog.test.mjs')
          test_text = tests.read_text()
          anchor = dec('TEST_ANCHOR')
          insert = dec('TEST_INSERT')
          if test_text.count(anchor) != 1:
              raise SystemExit(f'test anchor match count={test_text.count(anchor)}')
          tests.write_text(test_text.replace(anchor, insert, 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue29-qa-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js tests/decisionLog.test.mjs .github/workflows/issue29-qa-fix.yml
          git commit -m 'Fix subtitle sync newline-only QA regression'
          git push
