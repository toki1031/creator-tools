name: Issue 46 Cleanup Runner

on:
  push:
    branches:
      - issue-46-scene-subtitle-position-v07

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Bootstrap Issue 46 cleanup runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove generated files from branch
        run: |
          git rm -r --ignore-unmatch node_modules dist
          rm .github/workflows/issue46-cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated files from Issue 46 branch"
          git push origin HEAD:issue-46-scene-subtitle-position-v07
