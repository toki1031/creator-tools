name: Issue 54 Implementation Runner

on:
  push:
    branches:
      - issue-54-narration-voice-v011

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.11 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected one match for {old[:80]!r}, got {text.count(old)}')
              p.write_text(text.replace(old,new,1))

          # DecisionRecord helper.
          marker="export function moveSceneWithDecision(project, index, direction, options = {}) {"
          helper=r'''const KOKORO_NARRATION_VOICES = [
            'jf_alpha',
            'jf_gongitsune',
            'jf_nezumi',
            'jf_tebukuro',
            'jm_kumo'
          ];
          const KOKORO_NARRATION_VOICE_SET = new Set(KOKORO_NARRATION_VOICES);

          export function normalizeNarrationVoiceId(value) {
            const voiceId = stringOr(value).trim();
            return KOKORO_NARRATION_VOICE_SET.has(voiceId) ? voiceId : null;
          }

          export function recordNarrationVoiceDecision(project, {
            beforeVoiceId,
            afterVoiceId,
            generationMode,
            hadProjectNarration,
            sceneNarrationCountBefore
          }, options = {}) {
            const after = normalizeNarrationVoiceId(afterVoiceId);
            if (!after) return null;
            const before = normalizeNarrationVoiceId(beforeVoiceId);
            if (before === after) return null;
            const mode = generationMode === 'full' || generationMode === 'scenes' ? generationMode : '';
            if (!mode) return null;

            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const suppliedSceneNarrationCount = Number(sceneNarrationCountBefore);
            const priorSceneNarrationCount = Number.isInteger(suppliedSceneNarrationCount) && suppliedSceneNarrationCount >= 0
              ? suppliedSceneNarrationCount
              : scenes.filter(scene => Boolean(scene?.narration?.audioData)).length;
            const priorProjectNarration = typeof hadProjectNarration === 'boolean'
              ? hadProjectNarration
              : Boolean(project?.narration?.audioData);

            return appendDecision(project, {
              decisionType: 'narration-voice',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                engine: 'kokoro-js-jp',
                generationMode: mode,
                sceneCount: scenes.length,
                hadProjectNarration: priorProjectNarration,
                sceneNarrationCountBefore: priorSceneNarrationCount
              },
              proposal: { voiceId: before },
              alternatives: KOKORO_NARRATION_VOICES.filter(voiceId => voiceId !== after).map(voiceId => ({ voiceId })),
              humanAction: { type: 'choose-narration-voice', generationMode: mode },
              finalDecision: { voiceId: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'voice-lab', version: '0.11' },
              assetIds: [],
              rights: {}
            }, options);
          }

          '''+marker
          replace_once('decisionLog.js',marker,helper)

          # Voice Lab import.
          replace_once('voice-lab.html',
            'import { getProject, saveProject } from "./db.js";\n',
            'import { getProject, saveProject } from "./db.js";\nimport { recordNarrationVoiceDecision } from "./decisionLog.js";\n')

          p=Path('voice-lab.html')
          text=p.read_text()

          # Full narration registration section only.
          start=text.index("$('#register').onclick=async()=>{")
          end=text.index('async function wavDuration',start)
          section=text[start:end]
          needle='  project.narration={\n'
          if section.count(needle)!=1:
              raise SystemExit(f'voice-lab full narration marker count={section.count(needle)}')
          snapshot="  const narrationVoiceBefore=project.narration?.voiceId;\n  const hadProjectNarrationBefore=Boolean(project.narration?.audioData);\n  const sceneNarrationCountBefore=(Array.isArray(project.scenes)?project.scenes:[]).filter(scene=>Boolean(scene?.narration?.audioData)).length;\n\n"
          section=section.replace(needle,snapshot+needle,1)
          save_marker="  project.speechScript=text || project.speechScript || '';\n"
          if section.count(save_marker)!=1:
              raise SystemExit(f'voice-lab full save marker count={section.count(save_marker)}')
          record_full="  recordNarrationVoiceDecision(project,{\n    beforeVoiceId:narrationVoiceBefore,\n    afterVoiceId:voice,\n    generationMode:'full',\n    hadProjectNarration:hadProjectNarrationBefore,\n    sceneNarrationCountBefore\n  });\n"
          section=section.replace(save_marker,record_full+save_marker,1)
          text=text[:start]+section+text[end:]

          # Scene narration generation section only.
          start=text.index("$('#generateScenes').onclick=async()=>{")
          end=text.index("$('#download').onclick",start)
          section=text[start:end]
          voice_marker="    const voice=$('#voice').value;\n"
          if section.count(voice_marker)!=1:
              raise SystemExit(f'voice-lab scene voice marker count={section.count(voice_marker)}')
          scene_snapshot="    const narrationVoiceBefore=project.narration?.voiceId;\n    const hadProjectNarrationBefore=Boolean(project.narration?.audioData);\n    const sceneNarrationCountBefore=scenes.filter(scene=>Boolean(scene?.narration?.audioData)).length;\n\n"
          section=section.replace(voice_marker,scene_snapshot+voice_marker,1)
          final_save="    project.updatedAt=new Date().toISOString();\n    await saveProject(project);"
          pos=section.rfind(final_save)
          if pos<0:
              raise SystemExit('voice-lab final scene save marker not found')
          record_scenes="    recordNarrationVoiceDecision(project,{\n      beforeVoiceId:narrationVoiceBefore,\n      afterVoiceId:voice,\n      generationMode:'scenes',\n      hadProjectNarration:hadProjectNarrationBefore,\n      sceneNarrationCountBefore\n    });\n"
          section=section[:pos]+record_scenes+section[pos:]
          text=text[:start]+section+text[end:]
          p.write_text(text)

          # Tests.
          replace_once('tests/decisionLog.test.mjs','  normalizeBgmVolume,\n','  normalizeBgmVolume,\n  normalizeNarrationVoiceId,\n')
          replace_once('tests/decisionLog.test.mjs','  recordBgmVolumeChange,\n','  recordBgmVolumeChange,\n  recordNarrationVoiceDecision,\n')
          tests_path=Path('tests/decisionLog.test.mjs')
          tests=tests_path.read_text()
          tests+=r'''

          test('narration-voice records first Kokoro voice adoption without audio payload', () => {
            const project={id:'p-voice',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},narration:{audioData:'',voiceId:'legacy-browser-voice'},scenes:[{id:'s1',narration:{audioData:'data:audio/wav;base64,AA=='}},{id:'s2'}]};
            const record=recordNarrationVoiceDecision(project,{beforeVoiceId:'legacy-browser-voice',afterVoiceId:'jf_alpha',generationMode:'scenes',hadProjectNarration:false,sceneNarrationCountBefore:1},{createId:()=> 'd-voice-1',now:()=> '2026-09-05T00:00:00.000Z'});
            assert.equal(record.decisionType,'narration-voice');
            assert.equal(record.sceneId,'');
            assert.deepEqual(record.proposal,{voiceId:null});
            assert.deepEqual(record.finalDecision,{voiceId:'jf_alpha'});
            assert.deepEqual(record.humanAction,{type:'choose-narration-voice',generationMode:'scenes'});
            assert.deepEqual(record.source,{type:'human',feature:'voice-lab',version:'0.11'});
            assert.equal(record.context.engine,'kokoro-js-jp');
            assert.equal(record.context.generationMode,'scenes');
            assert.equal(record.context.sceneCount,2);
            assert.equal(record.context.hadProjectNarration,false);
            assert.equal(record.context.sceneNarrationCountBefore,1);
            assert.equal(record.alternatives.length,4);
            assert.equal(record.alternatives.some(item=>item.voiceId==='jf_alpha'),false);
            assert.equal(JSON.stringify(record).includes('data:audio'),false);
          });

          test('narration-voice records a changed accepted voice in full mode', () => {
            const project={id:'p-voice',platform:'instagram-reels',aspectRatio:'1:1',learning:{decisions:[]},narration:{audioData:'data:audio/wav;base64,OLD',voiceId:'jf_alpha',fileName:'old.wav'},scenes:[{id:'s1'}]};
            const record=recordNarrationVoiceDecision(project,{beforeVoiceId:'jf_alpha',afterVoiceId:'jm_kumo',generationMode:'full',hadProjectNarration:true,sceneNarrationCountBefore:0});
            assert.deepEqual(record.proposal,{voiceId:'jf_alpha'});
            assert.deepEqual(record.finalDecision,{voiceId:'jm_kumo'});
            assert.equal(record.context.generationMode,'full');
            assert.equal(record.context.hadProjectNarration,true);
            assert.equal(record.alternatives.some(item=>item.voiceId==='jf_alpha'),true);
            assert.equal(record.alternatives.some(item=>item.voiceId==='jm_kumo'),false);
            const serialized=JSON.stringify(record);
            assert.equal(serialized.includes('OLD'),false);
            assert.equal(serialized.includes('old.wav'),false);
          });

          test('narration voice normalization only accepts current Kokoro Voice Lab ids', () => {
            for(const id of ['jf_alpha','jf_gongitsune','jf_nezumi','jf_tebukuro','jm_kumo']) assert.equal(normalizeNarrationVoiceId(id),id);
            assert.equal(normalizeNarrationVoiceId(''),null);
            assert.equal(normalizeNarrationVoiceId('legacy'),null);
            assert.equal(normalizeNarrationVoiceId(undefined),null);
          });

          test('narration-voice ignores same voice, invalid final voice and invalid generation mode', () => {
            const project={id:'p',learning:{decisions:[]},narration:{},scenes:[]};
            assert.equal(recordNarrationVoiceDecision(project,{beforeVoiceId:'jf_alpha',afterVoiceId:'jf_alpha',generationMode:'full'}),null);
            assert.equal(recordNarrationVoiceDecision(project,{beforeVoiceId:null,afterVoiceId:'invalid',generationMode:'full'}),null);
            assert.equal(recordNarrationVoiceDecision(project,{beforeVoiceId:null,afterVoiceId:'jf_alpha',generationMode:'preview'}),null);
            assert.equal(project.learning.decisions.length,0);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Voice Lab inline module syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('voice-lab.html').read_text()
          start=text.index('<script type="module">')+len('<script type="module">')
          end=text.index('</script>',start)
          Path('/tmp/voice-lab.mjs').write_text(text[start:end])
          PY
          node --check /tmp/voice-lab.mjs
      - name: Build
        run: npm run build
      - name: Diff checks
        shell: bash
        run: |
          git diff --check
          git diff --exit-code f6248546e40f750ea00fba8fcc9dff56f3a42006 -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js main.js
          test "$(git diff --name-only f6248546e40f750ea00fba8fcc9dff56f3a42006 -- decisionLog.js voice-lab.html tests/decisionLog.test.mjs | wc -l)" -eq 3
      - name: Commit only intended source changes and remove runner
        shell: bash
        run: |
          rm .github/workflows/issue54-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git diff --name-only f6248546e40f750ea00fba8fcc9dff56f3a42006 | sort)"
          expected="$(printf '%s\n' decisionLog.js voice-lab.html tests/decisionLog.test.mjs | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js voice-lab.html tests/decisionLog.test.mjs .github/workflows/issue54-runner.yml
          git commit -m "Capture narration voice decisions"
          git push origin HEAD:issue-54-narration-voice-v011
