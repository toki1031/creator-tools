name: Issue 56 Implementation Runner

on:
  push:
    branches:
      - issue-56-bgm-audio-asset-id

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply BGM Audio Asset Identity patch
        shell: bash
        run: |
          cat > audioAssetIdentity.js <<'EOF'
          const AUDIO_ASSET_ID_PREFIX = 'audio-sha256:';
          const AUDIO_ASSET_ID_PATTERN = /^audio-sha256:[0-9a-f]{64}$/;

          function bytesToHex(value) {
            const bytes = value instanceof ArrayBuffer
              ? new Uint8Array(value)
              : ArrayBuffer.isView(value)
                ? new Uint8Array(value.buffer, value.byteOffset, value.byteLength)
                : null;
            if (!bytes) return '';
            return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
          }

          export function normalizeAudioAssetId(value) {
            const id = typeof value === 'string' ? value.trim().toLowerCase() : '';
            return AUDIO_ASSET_ID_PATTERN.test(id) ? id : '';
          }

          export async function createAudioAssetIdFromArrayBuffer(value, { digest } = {}) {
            try {
              const bytes = value instanceof ArrayBuffer
                ? new Uint8Array(value)
                : ArrayBuffer.isView(value)
                  ? new Uint8Array(value.buffer, value.byteOffset, value.byteLength)
                  : null;
              if (!bytes) return '';
              const digestFn = digest || globalThis.crypto?.subtle?.digest?.bind(globalThis.crypto.subtle);
              if (typeof digestFn !== 'function') return '';
              const hashed = await digestFn('SHA-256', bytes);
              const hex = bytesToHex(hashed);
              return hex.length === 64 ? `${AUDIO_ASSET_ID_PREFIX}${hex}` : '';
            } catch {
              return '';
            }
          }

          export async function createAudioAssetIdFromFile(file, options = {}) {
            try {
              if (!file || typeof file.arrayBuffer !== 'function') return '';
              return await createAudioAssetIdFromArrayBuffer(await file.arrayBuffer(), options);
            } catch {
              return '';
            }
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          replace_once(
              'main.js',
              'import { addImageAsset, assetUsageCount, assetUsageScenes, ensureMediaLibrary, estimateAssetBytes, promoteLegacySceneImage, removeAllUnusedAssets, removeUnusedAsset, renameMediaAsset, resolveSceneImageSource, summarizeMediaLibrary } from "./mediaLibrary.js";\n',
              'import { addImageAsset, assetUsageCount, assetUsageScenes, ensureMediaLibrary, estimateAssetBytes, promoteLegacySceneImage, removeAllUnusedAssets, removeUnusedAsset, renameMediaAsset, resolveSceneImageSource, summarizeMediaLibrary } from "./mediaLibrary.js";\nimport { createAudioAssetIdFromFile, normalizeAudioAssetId } from "./audioAssetIdentity.js";\n'
          )
          replace_once(
              'main.js',
              '  project.bgm = project.bgm || { source:"none", title:"", category:"calm", volume:0.12, ducking:true, fadeInSec:1, fadeOutSec:2, loop:true, license:"", credit:"", audioData:"", fileName:"" };\n',
              '  project.bgm = project.bgm || { source:"none", title:"", category:"calm", volume:0.12, ducking:true, fadeInSec:1, fadeOutSec:2, loop:true, license:"", credit:"", audioData:"", fileName:"", audioAssetId:"" };\n  project.bgm.audioAssetId = normalizeAudioAssetId(project.bgm.audioAssetId);\n'
          )
          old_upload = "    pendingAsset=fileToDataUrl(file).then(data=>{b.audioData=data;b.fileName=file.name;b.source='upload';});\n"
          new_upload = "    pendingAsset=(async()=>{const audioAssetId=await createAudioAssetIdFromFile(file);const data=await fileToDataUrl(file);b.audioData=data;b.fileName=file.name;b.source='upload';b.audioAssetId=audioAssetId;})();\n"
          replace_once('main.js', old_upload, new_upload)

          replace_once(
              'projectBackup.js',
              "import { normalizeLearningState } from './decisionLog.js';\n",
              "import { normalizeLearningState } from './decisionLog.js';\nimport { normalizeAudioAssetId } from './audioAssetIdentity.js';\n"
          )
          marker = "  const bgmSource = isRecord(source.bgm) ? safeClone(source.bgm) : {};\n  if (!isRecord(source.bgm)) fixes.push('BGM設定を補完');\n"
          replacement = marker + "  const requestedBgmAudioAssetId = stringOr(bgmSource.audioAssetId).trim();\n  const bgmAudioAssetId = normalizeAudioAssetId(requestedBgmAudioAssetId);\n  if (requestedBgmAudioAssetId && !bgmAudioAssetId) warnings.push('BGM音源IDを無効な値として除外しました。');\n"
          replace_once('projectBackup.js', marker, replacement)
          old_bgm = "    credit:stringOr(bgmSource.credit), audioData:cleanDataUrl(bgmSource.audioData, 'audio', 'BGM音源', warnings), fileName:stringOr(bgmSource.fileName)\n"
          new_bgm = "    credit:stringOr(bgmSource.credit), audioData:cleanDataUrl(bgmSource.audioData, 'audio', 'BGM音源', warnings), fileName:stringOr(bgmSource.fileName),\n    audioAssetId:bgmAudioAssetId\n"
          replace_once('projectBackup.js', old_bgm, new_bgm)

          Path('tests/audioAssetIdentity.test.mjs').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { createAudioAssetIdFromArrayBuffer, createAudioAssetIdFromFile, normalizeAudioAssetId } from '../audioAssetIdentity.js';

          const encoder = new TextEncoder();
          const ABC_SHA256 = 'audio-sha256:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';

          test('audio asset id uses SHA-256 of raw bytes', async () => {
            assert.equal(await createAudioAssetIdFromArrayBuffer(encoder.encode('abc')), ABC_SHA256);
          });

          test('same audio bytes keep the same identity and different bytes change it', async () => {
            const a1=await createAudioAssetIdFromArrayBuffer(encoder.encode('same-audio'));
            const a2=await createAudioAssetIdFromArrayBuffer(encoder.encode('same-audio'));
            const b=await createAudioAssetIdFromArrayBuffer(encoder.encode('different-audio'));
            assert.equal(a1,a2);
            assert.notEqual(a1,b);
          });

          test('audio asset id normalization accepts canonical ids and rejects malformed values', () => {
            assert.equal(normalizeAudioAssetId(ABC_SHA256.toUpperCase()),ABC_SHA256);
            assert.equal(normalizeAudioAssetId('audio-sha256:abc'),'');
            assert.equal(normalizeAudioAssetId('sha256:'+ABC_SHA256.slice(-64)),'');
            assert.equal(normalizeAudioAssetId(undefined),'');
          });

          test('file hashing and digest failures never break BGM upload identity flow', async () => {
            const fakeFile={arrayBuffer:async()=>encoder.encode('abc').buffer};
            assert.equal(await createAudioAssetIdFromFile(fakeFile),ABC_SHA256);
            assert.equal(await createAudioAssetIdFromFile(fakeFile,{digest:async()=>{throw new Error('unavailable')}}),'');
            assert.equal(await createAudioAssetIdFromFile(null),'');
          });
          ''')

          p=Path('tests/projectBackup.test.mjs')
          tests=p.read_text()
          tests += r'''

          test('BGM audioAssetIdをschemaVersion 4のままbackup restoreで保持する', () => {
            const raw=sample();
            raw.bgm.audioAssetId='audio-sha256:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
            const normalized=normalizeImportedProject(raw);
            assert.equal(normalized.project.schemaVersion,4);
            assert.equal(normalized.project.bgm.audioAssetId,raw.bgm.audioAssetId);
            const restored=createRestoredProject(normalized.project);
            assert.equal(restored.bgm.audioAssetId,raw.bgm.audioAssetId);
            const payload=createProjectBackupPayload(restored);
            assert.equal(payload.bgm.audioAssetId,raw.bgm.audioAssetId);
          });

          test('不正なBGM audioAssetIdは音源自体を壊さず除外する', () => {
            const raw=sample();
            raw.bgm.audioAssetId='audio-sha256:not-a-valid-hash';
            const normalized=normalizeImportedProject(raw);
            assert.equal(normalized.project.bgm.audioAssetId,'');
            assert.equal(normalized.project.bgm.audioData,audio);
            assert.ok(normalized.warnings.some(item=>item.includes('BGM音源ID')));
          });
          '''
          p.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff checks
        shell: bash
        run: |
          git add -N audioAssetIdentity.js tests/audioAssetIdentity.test.mjs
          git diff --check
          git diff --exit-code 8411764991f62a46aaef1fbbb16f4a6f6cd60a13 -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js decisionLog.js voice-lab.html
          changed="$(git diff --name-only 8411764991f62a46aaef1fbbb16f4a6f6cd60a13 | grep -v '^.github/workflows/issue56-runner.yml$' | sort)"
          expected="$(printf '%s\n' audioAssetIdentity.js main.js projectBackup.js tests/audioAssetIdentity.test.mjs tests/projectBackup.test.mjs | sort)"
          test "$changed" = "$expected"
      - name: Commit only intended source changes and remove runner
        shell: bash
        run: |
          rm .github/workflows/issue56-runner.yml
          rm -rf dist node_modules package-lock.json
          git add audioAssetIdentity.js main.js projectBackup.js tests/audioAssetIdentity.test.mjs tests/projectBackup.test.mjs .github/workflows/issue56-runner.yml
          git clean -fdx
          git diff --cached --check
          changed="$(git diff --name-only 8411764991f62a46aaef1fbbb16f4a6f6cd60a13 | sort)"
          expected="$(printf '%s\n' audioAssetIdentity.js main.js projectBackup.js tests/audioAssetIdentity.test.mjs tests/projectBackup.test.mjs | sort)"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add stable BGM audio asset identity"
          git push origin HEAD:issue-56-bgm-audio-asset-id
