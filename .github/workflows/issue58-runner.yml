name: Issue 58 Implementation Runner
on:
  push:
    branches: [issue-58-bgm-selection-v012]
permissions:
  contents: write
jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply Dataset v0.12 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
            p=Path(path); t=p.read_text(); n=t.count(old)
            if n!=1: raise SystemExit(f'{path}: expected 1 match, got {n}')
            p.write_text(t.replace(old,new,1))

          rep('decisionLog.js',"import { normalizeSubtitleOffset } from './subtitlePosition.js';\n", "import { normalizeSubtitleOffset } from './subtitlePosition.js';\nimport { normalizeAudioAssetId } from './audioAssetIdentity.js';\n")
          marker="const KOKORO_NARRATION_VOICES = ["
          helper=r'''export function recordBgmSelectionChange(project, {
            beforeAudioAssetId,
            afterAudioAssetId,
            selectionMethod = 'upload',
            hadBgmBefore,
            bgmCategory,
            ducking,
            loop
          }, options = {}) {
            const before = normalizeAudioAssetId(beforeAudioAssetId) || null;
            const after = normalizeAudioAssetId(afterAudioAssetId) || null;
            if (!after || before === after) return null;
            if (selectionMethod !== 'upload') return null;
            const bgm = isRecord(project?.bgm) ? project.bgm : {};
            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const currentCategory = typeof bgmCategory === 'string' ? bgmCategory.trim() : stringOr(bgm.category).trim();
            const currentDucking = typeof ducking === 'boolean' ? ducking : Boolean(bgm.ducking);
            const currentLoop = typeof loop === 'boolean' ? loop : Boolean(bgm.loop);
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));
            const priorBgm = typeof hadBgmBefore === 'boolean' ? hadBgmBefore : Boolean(before);
            return appendDecision(project, {
              decisionType: 'bgm-selection', sceneId: '',
              context: { platform:stringOr(project?.platform), aspectRatio:stringOr(project?.aspectRatio), selectionMethod:'upload', bgmCategory:currentCategory, hadBgmBefore:priorBgm, ducking:currentDucking, loop:currentLoop, sceneCount:scenes.length, hasNarration },
              proposal: { audioAssetId: before }, alternatives: [],
              humanAction: { type:'select-bgm-audio', selectionMethod:'upload' },
              finalDecision: { audioAssetId: after }, reasonCode:'', reasonNote:'',
              source: { type:'human', feature:'bgm-editor', version:'0.12' },
              assetIds: [...new Set([before,after].filter(Boolean))], rights: {}
            }, options);
          }

          '''+marker
          rep('decisionLog.js',marker,helper)
          rep('main.js','recordBgmVolumeChange, recordGlobalSubtitlePositionChange','recordBgmSelectionChange, recordBgmVolumeChange, recordGlobalSubtitlePositionChange')
          old="    pendingAsset=(async()=>{const audioAssetId=await createAudioAssetIdFromFile(file);const data=await fileToDataUrl(file);b.audioData=data;b.fileName=file.name;b.source='upload';b.audioAssetId=audioAssetId;})();\n"
          new="    const beforeAudioAssetId=b.audioAssetId;const hadBgmBefore=Boolean(b.audioData);\n    pendingAsset=(async()=>{const audioAssetId=await createAudioAssetIdFromFile(file);const data=await fileToDataUrl(file);b.audioData=data;b.fileName=file.name;b.source='upload';b.audioAssetId=audioAssetId;recordBgmSelectionChange(project,{beforeAudioAssetId,afterAudioAssetId:audioAssetId,selectionMethod:'upload',hadBgmBefore,bgmCategory:root.querySelector('#category').value,ducking:root.querySelector('#ducking').checked,loop:root.querySelector('#loop').checked});})();\n"
          rep('main.js',old,new)
          rep('tests/decisionLog.test.mjs','  recordBgmVolumeChange,\n','  recordBgmSelectionChange,\n  recordBgmVolumeChange,\n')
          p=Path('tests/decisionLog.test.mjs'); t=p.read_text(); t+=r'''

          test('bgm-selection records first uploaded audio asset with compact context', () => {
            const after='audio-sha256:ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
            const project={id:'p-bgm-select',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},bgm:{audioAssetId:after,audioData:'data:audio/wav;base64,SECRET',fileName:'private.wav',title:'private title',category:'calm',ducking:true,loop:true,license:'private license',credit:'private credit'},scenes:[{id:'s1',narration:{audioData:'data:audio/wav;base64,AA=='}},{id:'s2'}]};
            const record=recordBgmSelectionChange(project,{beforeAudioAssetId:null,afterAudioAssetId:after,selectionMethod:'upload',hadBgmBefore:false},{createId:()=> 'd-bgm-select',now:()=> '2026-09-05T00:00:00.000Z'});
            assert.equal(record.decisionType,'bgm-selection'); assert.equal(record.sceneId,'');
            assert.deepEqual(record.proposal,{audioAssetId:null}); assert.deepEqual(record.finalDecision,{audioAssetId:after}); assert.deepEqual(record.alternatives,[]);
            assert.deepEqual(record.humanAction,{type:'select-bgm-audio',selectionMethod:'upload'}); assert.deepEqual(record.source,{type:'human',feature:'bgm-editor',version:'0.12'});
            assert.deepEqual(record.assetIds,[after]); assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{platform:'youtube-shorts',aspectRatio:'9:16',selectionMethod:'upload',bgmCategory:'calm',hadBgmBefore:false,ducking:true,loop:true,sceneCount:2,hasNarration:true});
            const serialized=JSON.stringify(record); for(const secret of ['SECRET','private.wav','private title','private license','private credit']) assert.equal(serialized.includes(secret),false);
          });
          test('bgm-selection records replacement and keeps both stable asset ids', () => {
            const before='audio-sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', after='audio-sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb';
            const project={id:'p',platform:'instagram-reels',aspectRatio:'1:1',learning:{decisions:[]},bgm:{category:'history',ducking:false,loop:false},scenes:[]};
            const record=recordBgmSelectionChange(project,{beforeAudioAssetId:before,afterAudioAssetId:after,selectionMethod:'upload',hadBgmBefore:true});
            assert.deepEqual(record.proposal,{audioAssetId:before}); assert.deepEqual(record.finalDecision,{audioAssetId:after}); assert.deepEqual(record.assetIds,[before,after]); assert.equal(record.context.hadBgmBefore,true); assert.equal(record.context.bgmCategory,'history');
          });
          test('bgm-selection ignores same hash, missing hash, malformed id and unsupported method', () => {
            const id='audio-sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc', project={id:'p',learning:{decisions:[]},bgm:{},scenes:[]};
            assert.equal(recordBgmSelectionChange(project,{beforeAudioAssetId:id,afterAudioAssetId:id,selectionMethod:'upload'}),null);
            assert.equal(recordBgmSelectionChange(project,{beforeAudioAssetId:null,afterAudioAssetId:'',selectionMethod:'upload'}),null);
            assert.equal(recordBgmSelectionChange(project,{beforeAudioAssetId:null,afterAudioAssetId:'audio-sha256:bad',selectionMethod:'upload'}),null);
            assert.equal(recordBgmSelectionChange(project,{beforeAudioAssetId:null,afterAudioAssetId:id,selectionMethod:'library'}),null); assert.equal(project.learning.decisions.length,0);
          });
          test('bgm-selection normalizes legacy/invalid previous id to null', () => {
            const after='audio-sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd', project={id:'p',learning:{decisions:[]},bgm:{category:'calm'},scenes:[]};
            const record=recordBgmSelectionChange(project,{beforeAudioAssetId:'legacy-file-name.mp3',afterAudioAssetId:after,selectionMethod:'upload',hadBgmBefore:true});
            assert.deepEqual(record.proposal,{audioAssetId:null}); assert.equal(record.context.hadBgmBefore,true); assert.deepEqual(record.assetIds,[after]);
          });
          '''; p.write_text(t)
          PY
      - run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Protected diff check
        shell: bash
        run: |
          git diff --check
          git diff --exit-code efaa5e8bf1c8598ccd4d93deb42253d963987101 -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html
      - name: Commit intended changes
        shell: bash
        run: |
          rm .github/workflows/issue58-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue58-runner.yml
          git commit -m "Capture BGM selection decisions"
          git push origin HEAD:issue-58-bgm-selection-v012
