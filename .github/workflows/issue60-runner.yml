name: Issue 60 Implementation Runner
on:
  push:
    branches: [issue-60-subtitle-preset-v013]
permissions:
  contents: write
jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply Dataset v0.13 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          BASE='d1bfa3003ead853273bbf9c4712c35f90d7734bf'

          def rep(path, old, new):
            p=Path(path); t=p.read_text(); n=t.count(old)
            if n!=1: raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:140]!r}')
            p.write_text(t.replace(old,new,1))

          # decisionLog.js
          marker="export function recordBgmSelectionChange(project, {"
          helper=r'''const SUBTITLE_PRESET_IDS = ['standard', 'large', 'minimal', 'boxed'];
          const SUBTITLE_PRESET_SET = new Set(SUBTITLE_PRESET_IDS);
          const SUBTITLE_POSITIONS = new Set(['top', 'center', 'bottom']);

          function subtitlePresetNumber(value) {
            const number = Number(value);
            return Number.isFinite(number) ? number : null;
          }

          function normalizeSubtitlePresetState(value, { fallbackPreset = false } = {}) {
            if (!isRecord(value)) return null;
            const rawPreset = stringOr(value.preset).trim();
            const preset = SUBTITLE_PRESET_SET.has(rawPreset) ? rawPreset : (fallbackPreset ? 'standard' : '');
            if (!preset) return null;
            const style = isRecord(value.style) ? value.style : {};
            const rawPosition = stringOr(style.position).trim();
            return {
              preset,
              style: {
                fontSize: subtitlePresetNumber(style.fontSize),
                position: SUBTITLE_POSITIONS.has(rawPosition) ? rawPosition : null,
                maxCharsPerLine: subtitlePresetNumber(style.maxCharsPerLine),
                maxLines: subtitlePresetNumber(style.maxLines),
                outlineWidth: subtitlePresetNumber(style.outlineWidth),
                backgroundEnabled: Boolean(style.backgroundEnabled),
                backgroundOpacity: subtitlePresetNumber(style.backgroundOpacity)
              }
            };
          }

          export function snapshotSubtitlePresetState(style) {
            const source = isRecord(style) ? style : {};
            return normalizeSubtitlePresetState({
              preset: source.preset,
              style: {
                fontSize: source.fontSize,
                position: source.position,
                maxCharsPerLine: source.maxCharsPerLine,
                maxLines: source.maxLines,
                outlineWidth: source.outlineWidth,
                backgroundEnabled: source.backgroundEnabled,
                backgroundOpacity: source.backgroundOpacity
              }
            }, { fallbackPreset: true });
          }

          export function recordSubtitlePresetChange(project, { beforeState, afterState }, options = {}) {
            const before = normalizeSubtitlePresetState(beforeState, { fallbackPreset: true });
            const after = normalizeSubtitlePresetState(afterState);
            if (!before || !after || before.preset === after.preset) return null;

            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const overridePositions = new Set(['top', 'center', 'bottom']);
            const subtitleSceneCount = scenes.filter(scene => stringOr(scene?.subtitleText).trim()).length;
            const sceneOverrideCount = scenes.filter(scene => overridePositions.has(stringOr(scene?.subtitlePosition).trim())).length;

            return appendDecision(project, {
              decisionType: 'subtitle-preset',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                subtitleEnabled: Boolean(project?.subtitleStyle?.enabled),
                sceneCount: scenes.length,
                subtitleSceneCount,
                sceneOverrideCount
              },
              proposal: before,
              alternatives: SUBTITLE_PRESET_IDS.filter(preset => preset !== after.preset).map(preset => ({ preset })),
              humanAction: { type: 'select-subtitle-preset' },
              finalDecision: after,
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'subtitle-editor', version: '0.13' },
              assetIds: [],
              rights: {}
            }, options);
          }

          '''+marker
          rep('decisionLog.js', marker, helper)

          # main.js imports
          rep(
            'main.js',
            'recordSubtitleContentChange, recordSubtitleSceneSyncDecision, snapshotGlobalSubtitlePosition, snapshotSceneSubtitlePosition',
            'recordSubtitleContentChange, recordSubtitlePresetChange, recordSubtitleSceneSyncDecision, snapshotGlobalSubtitlePosition, snapshotSceneSubtitlePosition, snapshotSubtitlePresetState'
          )

          old_handler="  root.querySelector('#subtitlePreset').onchange=()=>{const p=presets[root.querySelector('#subtitlePreset').value];Object.assign(st,p,{preset:root.querySelector('#subtitlePreset').value});root.querySelector('#fontSize').value=st.fontSize;root.querySelector('#subtitlePosition').value=st.position;root.querySelector('#maxChars').value=st.maxCharsPerLine;root.querySelector('#maxLines').value=String(st.maxLines);root.querySelector('#outlineWidth').value=st.outlineWidth;root.querySelector('#backgroundEnabled').checked=st.backgroundEnabled;root.querySelector('#backgroundOpacity').value=st.backgroundOpacity;updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();};\n"
          new_handler="""  root.querySelector('#subtitlePreset').onchange=()=>{const beforePresetState=snapshotSubtitlePresetState(st);const p=presets[root.querySelector('#subtitlePreset').value];Object.assign(st,p,{preset:root.querySelector('#subtitlePreset').value});root.querySelector('#fontSize').value=st.fontSize;root.querySelector('#subtitlePosition').value=st.position;root.querySelector('#maxChars').value=st.maxCharsPerLine;root.querySelector('#maxLines').value=String(st.maxLines);root.querySelector('#outlineWidth').value=st.outlineWidth;root.querySelector('#backgroundEnabled').checked=st.backgroundEnabled;root.querySelector('#backgroundOpacity').value=st.backgroundOpacity;const afterPresetState=snapshotSubtitlePresetState(st);recordSubtitlePresetChange(project,{beforeState:beforePresetState,afterState:afterPresetState});updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();};\n"""
          rep('main.js', old_handler, new_handler)

          # tests imports
          rep('tests/decisionLog.test.mjs','  recordSubtitleSceneSyncDecision,\n','  recordSubtitlePresetChange,\n  recordSubtitleSceneSyncDecision,\n')
          rep('tests/decisionLog.test.mjs','  snapshotSceneSubtitlePosition,\n','  snapshotSceneSubtitlePosition,\n  snapshotSubtitlePresetState,\n')

          p=Path('tests/decisionLog.test.mjs'); t=p.read_text(); t+=r'''

          test('subtitle-preset records standard to large with effective style and context', () => {
            const project={id:'p-preset',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},subtitleStyle:{enabled:true},scenes:[{id:'s1',subtitleText:'字幕あり'},{id:'s2',subtitleText:'',subtitlePosition:'top'},{id:'s3',subtitleText:'別字幕',subtitlePosition:'invalid'}]};
            const before=snapshotSubtitlePresetState({preset:'standard',fontSize:54,position:'bottom',maxCharsPerLine:16,maxLines:2,outlineWidth:4,backgroundEnabled:false,backgroundOpacity:.45});
            const after=snapshotSubtitlePresetState({preset:'large',fontSize:68,position:'bottom',maxCharsPerLine:13,maxLines:2,outlineWidth:5,backgroundEnabled:false,backgroundOpacity:.45});
            const record=recordSubtitlePresetChange(project,{beforeState:before,afterState:after},{createId:()=> 'd-preset-1',now:()=> '2026-09-05T00:00:00.000Z'});
            assert.equal(record.decisionType,'subtitle-preset');
            assert.equal(record.sceneId,'');
            assert.deepEqual(record.proposal,before);
            assert.deepEqual(record.finalDecision,after);
            assert.deepEqual(record.humanAction,{type:'select-subtitle-preset'});
            assert.deepEqual(record.source,{type:'human',feature:'subtitle-editor',version:'0.13'});
            assert.deepEqual(record.alternatives,[{preset:'standard'},{preset:'minimal'},{preset:'boxed'}]);
            assert.deepEqual(record.context,{platform:'youtube-shorts',aspectRatio:'9:16',subtitleEnabled:true,sceneCount:3,subtitleSceneCount:2,sceneOverrideCount:1});
          });

          test('subtitle-preset records minimal to boxed including the applied style bundle', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{enabled:false},scenes:[]};
            const before=snapshotSubtitlePresetState({preset:'minimal',fontSize:48,position:'center',maxCharsPerLine:18,maxLines:2,outlineWidth:2,backgroundEnabled:false,backgroundOpacity:.35});
            const after=snapshotSubtitlePresetState({preset:'boxed',fontSize:52,position:'bottom',maxCharsPerLine:16,maxLines:2,outlineWidth:0,backgroundEnabled:true,backgroundOpacity:.58});
            const record=recordSubtitlePresetChange(project,{beforeState:before,afterState:after});
            assert.equal(record.proposal.preset,'minimal');
            assert.equal(record.finalDecision.preset,'boxed');
            assert.deepEqual(record.finalDecision.style,{fontSize:52,position:'bottom',maxCharsPerLine:16,maxLines:2,outlineWidth:0,backgroundEnabled:true,backgroundOpacity:.58});
            assert.deepEqual(record.alternatives,[{preset:'standard'},{preset:'large'},{preset:'minimal'}]);
          });

          test('subtitle preset snapshot treats missing or legacy preset as UI-effective standard and normalizes invalid style values', () => {
            const snapshot=snapshotSubtitlePresetState({preset:'legacy',fontSize:'54',position:'side',maxCharsPerLine:'16',maxLines:2,outlineWidth:'bad',backgroundEnabled:1,backgroundOpacity:'0.45'});
            assert.deepEqual(snapshot,{preset:'standard',style:{fontSize:54,position:null,maxCharsPerLine:16,maxLines:2,outlineWidth:null,backgroundEnabled:true,backgroundOpacity:.45}});
            assert.equal(snapshotSubtitlePresetState({}).preset,'standard');
          });

          test('subtitle-preset ignores same preset and invalid final preset', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{},scenes:[]};
            const standard=snapshotSubtitlePresetState({preset:'standard',fontSize:54,position:'bottom'});
            assert.equal(recordSubtitlePresetChange(project,{beforeState:standard,afterState:standard}),null);
            assert.equal(recordSubtitlePresetChange(project,{beforeState:standard,afterState:{preset:'invalid',style:{fontSize:1}}}),null);
            assert.equal(project.learning.decisions.length,0);
          });
          '''; p.write_text(t)

          # Static assurance: preset handler must not call v0.8 global position logging.
          main=Path('main.js').read_text()
          start=main.index("root.querySelector('#subtitlePreset').onchange")
          end=main.index("root.querySelector('#audioFile').onchange",start)
          handler=main[start:end]
          if 'recordSubtitlePresetChange' not in handler: raise SystemExit('preset Dataset hook missing')
          if 'recordGlobalSubtitlePositionChange' in handler: raise SystemExit('preset handler would duplicate v0.8 global-position record')
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Protected diff check
        shell: bash
        run: |
          git diff --check
          git diff --exit-code d1bfa3003ead853273bbf9c4712c35f90d7734bf -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html
      - name: Commit intended changes
        shell: bash
        run: |
          rm .github/workflows/issue60-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue60-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue60-runner.yml
          git commit -m "Capture subtitle preset decisions"
          git push origin HEAD:issue-60-subtitle-preset-v013