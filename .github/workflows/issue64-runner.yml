name: Issue 64 Implementation Runner
on:
  push:
    branches: [issue-64-bgm-ducking-v015]
permissions:
  contents: write
jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply Dataset v0.15 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          BASE='c7749ffd5fa1a2d98da618cacb4db47dd99728f7'
          def rep(path, old, new):
            p=Path(path); t=p.read_text(); n=t.count(old)
            if n!=1: raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:180]!r}')
            p.write_text(t.replace(old,new,1))

          # decisionLog.js: add BGM ducking DecisionRecord helper before BGM volume normalization.
          marker='export function normalizeBgmVolume(value) {'
          helper=r'''export function recordBgmDuckingChange(project, {
            beforeDucking,
            afterDucking,
            bgmSource,
            bgmCategory,
            bgmVolume,
            loop,
            hasBgm
          }, options = {}) {
            if (typeof beforeDucking !== 'boolean' || typeof afterDucking !== 'boolean' || beforeDucking === afterDucking) return null;

            const bgm = isRecord(project?.bgm) ? project.bgm : {};
            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const currentVolume = normalizeBgmVolume(bgmVolume ?? bgm.volume);
            const audioAssetId = normalizeAudioAssetId(bgm.audioAssetId);
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));
            const currentHasBgm = typeof hasBgm === 'boolean' ? hasBgm : Boolean(bgm.audioData);
            const currentLoop = typeof loop === 'boolean' ? loop : Boolean(bgm.loop);

            return appendDecision(project, {
              decisionType: 'bgm-ducking',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                bgmSource: typeof bgmSource === 'string' ? bgmSource.trim() : stringOr(bgm.source).trim(),
                bgmCategory: typeof bgmCategory === 'string' ? bgmCategory.trim() : stringOr(bgm.category).trim(),
                bgmVolume: currentVolume,
                loop: currentLoop,
                hasBgm: currentHasBgm,
                hasNarration,
                sceneCount: scenes.length
              },
              proposal: { ducking: beforeDucking },
              alternatives: [{ ducking: !afterDucking }],
              humanAction: { type: 'set-bgm-ducking' },
              finalDecision: { ducking: afterDucking },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'bgm-editor', version: '0.15' },
              assetIds: audioAssetId ? [audioAssetId] : [],
              rights: {}
            }, options);
          }

          '''+marker
          rep('decisionLog.js', marker, helper)

          # main.js import.
          rep(
            'main.js',
            'recordBgmSelectionChange, recordBgmVolumeChange, recordGlobalSubtitlePositionChange',
            'recordBgmDuckingChange, recordBgmSelectionChange, recordBgmVolumeChange, recordGlobalSubtitlePositionChange'
          )

          # Keep existing generic BGM behavior for all controls except ducking, which gets a dedicated explicit-decision handler.
          old_generic="  ['source','category','bgmTitle','fadeIn','fadeOut','ducking','loop','license','credit'].forEach(k=>root.querySelector('#'+k).oninput=()=>{updateLabels();save();});\n"
          new_generic="  ['source','category','bgmTitle','fadeIn','fadeOut','loop','license','credit'].forEach(k=>root.querySelector('#'+k).oninput=()=>{updateLabels();save();});\n"
          rep('main.js', old_generic, new_generic)

          ducking_handler=r'''  const bgmDuckingBeforeByElement=new WeakMap();
          const duckingEl=root.querySelector('#ducking');
          const rememberBgmDuckingBefore=el=>{if(bgmDuckingBeforeByElement.has(el))return;bgmDuckingBeforeByElement.set(el,Boolean(el.checked));};
          const commitBgmDuckingDecision=el=>{if(!bgmDuckingBeforeByElement.has(el))return;const before=bgmDuckingBeforeByElement.get(el);bgmDuckingBeforeByElement.delete(el);const record=recordBgmDuckingChange(project,{beforeDucking:before,afterDucking:Boolean(el.checked),bgmSource:root.querySelector('#source').value,bgmCategory:root.querySelector('#category').value,bgmVolume:root.querySelector('#volume').value,loop:root.querySelector('#loop').checked,hasBgm:Boolean(b.audioData)});if(record)save();};
          duckingEl.onpointerdown=()=>rememberBgmDuckingBefore(duckingEl);
          duckingEl.onfocus=()=>rememberBgmDuckingBefore(duckingEl);
          duckingEl.onkeydown=()=>rememberBgmDuckingBefore(duckingEl);
          duckingEl.oninput=()=>{updateLabels();save();};
          duckingEl.onchange=()=>commitBgmDuckingDecision(duckingEl);
          duckingEl.onpointercancel=()=>bgmDuckingBeforeByElement.delete(duckingEl);
          duckingEl.onblur=()=>commitBgmDuckingDecision(duckingEl);
'''
          rep('main.js', new_generic, new_generic+ducking_handler)

          # Test imports.
          rep('tests/decisionLog.test.mjs','  recordBgmSelectionChange,\n','  recordBgmDuckingChange,\n  recordBgmSelectionChange,\n')

          p=Path('tests/decisionLog.test.mjs'); t=p.read_text(); t+=r'''

          test('bgm-ducking records explicit true to false decision with compact mix context', () => {
            const audioAssetId='audio-sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee';
            const project={
              id:'p-duck',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              bgm:{source:'upload',category:'calm',volume:0.12,loop:true,audioAssetId,audioData:'data:audio/wav;base64,SECRET',fileName:'private.wav',title:'private title',license:'private license',credit:'private credit'},
              scenes:[{id:'s1',narration:{audioData:'data:audio/wav;base64,AA=='}},{id:'s2'}]
            };
            const record=recordBgmDuckingChange(project,{beforeDucking:true,afterDucking:false,bgmSource:'upload',bgmCategory:'history',bgmVolume:'0.18',loop:false,hasBgm:true},{createId:()=> 'd-duck-1',now:()=> '2026-09-05T01:00:00.000Z'});
            assert.equal(record.decisionType,'bgm-ducking');
            assert.equal(record.sceneId,'');
            assert.deepEqual(record.proposal,{ducking:true});
            assert.deepEqual(record.finalDecision,{ducking:false});
            assert.deepEqual(record.alternatives,[{ducking:true}]);
            assert.deepEqual(record.humanAction,{type:'set-bgm-ducking'});
            assert.deepEqual(record.source,{type:'human',feature:'bgm-editor',version:'0.15'});
            assert.deepEqual(record.assetIds,[audioAssetId]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{platform:'youtube-shorts',aspectRatio:'9:16',bgmSource:'upload',bgmCategory:'history',bgmVolume:0.18,loop:false,hasBgm:true,hasNarration:true,sceneCount:2});
            const serialized=JSON.stringify(record);
            for(const secret of ['SECRET','private.wav','private title','private license','private credit']) assert.equal(serialized.includes(secret),false);
          });

          test('bgm-ducking records explicit false to true decision', () => {
            const project={id:'p-duck-on',platform:'instagram-reels',aspectRatio:'1:1',learning:{decisions:[]},bgm:{source:'none',category:'sleep',volume:0.08,loop:true},scenes:[]};
            const record=recordBgmDuckingChange(project,{beforeDucking:false,afterDucking:true,bgmSource:'none',bgmCategory:'sleep',bgmVolume:0.08,loop:true,hasBgm:false});
            assert.deepEqual(record.proposal,{ducking:false});
            assert.deepEqual(record.finalDecision,{ducking:true});
            assert.deepEqual(record.alternatives,[{ducking:false}]);
            assert.equal(record.context.hasBgm,false);
            assert.equal(record.context.hasNarration,false);
            assert.deepEqual(record.assetIds,[]);
          });

          test('bgm-ducking ignores same and non-boolean states without noise', () => {
            const project={id:'p-duck-invalid',learning:{decisions:[]},bgm:{},scenes:[]};
            assert.equal(recordBgmDuckingChange(project,{beforeDucking:true,afterDucking:true}),null);
            assert.equal(recordBgmDuckingChange(project,{beforeDucking:'true',afterDucking:false}),null);
            assert.equal(recordBgmDuckingChange(project,{beforeDucking:false,afterDucking:1}),null);
            assert.equal(recordBgmDuckingChange(project,{beforeDucking:null,afterDucking:true}),null);
            assert.equal(project.learning.decisions.length,0);
          });

          test('bgm-ducking only links a valid current audio asset id and normalizes volume context', () => {
            const project={id:'p-duck-asset',learning:{decisions:[]},bgm:{audioAssetId:'legacy.mp3',source:'upload',category:'calm',volume:9,loop:false,audioData:'data:audio/wav;base64,AA=='},scenes:[]};
            const record=recordBgmDuckingChange(project,{beforeDucking:true,afterDucking:false});
            assert.deepEqual(record.assetIds,[]);
            assert.equal(record.context.bgmVolume,0.5);
            assert.equal(record.context.hasBgm,true);
            assert.equal(record.context.loop,false);
          });
'''; p.write_text(t)

          # Static assurances for direct-only capture and preserved autosave.
          main=Path('main.js').read_text()
          generic_start=main.index("['source','category','bgmTitle','fadeIn','fadeOut','loop'")
          duck_start=main.index('const bgmDuckingBeforeByElement',generic_start)
          if "'ducking'" in main[generic_start:duck_start]: raise SystemExit('ducking still exists in generic BGM handler')
          volume_start=main.index('const bgmVolumeBeforeByElement',duck_start)
          duck_handler=main[duck_start:volume_start]
          for token in ['recordBgmDuckingChange','oninput','onchange','save()','bgmVolume','hasBgm']:
            if token not in duck_handler: raise SystemExit(f'ducking handler missing {token}')
          if main.count('recordBgmDuckingChange') != 2: raise SystemExit('unexpected BGM ducking record call outside import + dedicated handler')
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Protected diff check
        shell: bash
        run: |
          git diff --check
          git diff --exit-code c7749ffd5fa1a2d98da618cacb4db47dd99728f7 -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html
      - name: Commit intended changes
        shell: bash
        run: |
          rm .github/workflows/issue64-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue64-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue64-runner.yml
          git commit -m "Capture BGM ducking decisions"
          git push origin HEAD:issue-64-bgm-ducking-v015