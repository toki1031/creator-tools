name: Issue 76 Implementation Runner

on:
  push:
    branches:
      - issue-76-bgm-fade-in-v021

permissions:
  contents: write

jobs:
  implement-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.21 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))

          marker = "export function recordBgmLoopChange(project, {"
          helper = r'''export function normalizeBgmFadeSeconds(value) {
            if (value === '' || value === null || value === undefined) return null;
            const number = Number(value);
            if (!Number.isFinite(number) || number < 0 || number > 30) return null;
            const doubled = number * 2;
            if (Math.abs(doubled - Math.round(doubled)) > 1e-9) return null;
            return Math.round(doubled) / 2;
          }

          export function snapshotBgmFadeIn(value) {
            return { fadeInSec: normalizeBgmFadeSeconds(value) };
          }

          export function recordBgmFadeInChange(project, {
            beforeState,
            afterState,
            bgmSource,
            bgmCategory,
            bgmVolume,
            fadeOutSec,
            ducking,
            loop,
            hasBgm
          }, options = {}) {
            const beforeRaw = isRecord(beforeState) ? beforeState.fadeInSec : beforeState;
            const afterRaw = isRecord(afterState) ? afterState.fadeInSec : afterState;
            const before = normalizeBgmFadeSeconds(beforeRaw);
            const after = normalizeBgmFadeSeconds(afterRaw);
            if (after === null || before === after) return null;

            const bgm = isRecord(project?.bgm) ? project.bgm : {};
            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const currentVolume = normalizeBgmVolume(bgmVolume ?? bgm.volume);
            const currentFadeOut = normalizeBgmFadeSeconds(fadeOutSec ?? bgm.fadeOutSec);
            const currentDucking = typeof ducking === 'boolean' ? ducking : Boolean(bgm.ducking);
            const currentLoop = typeof loop === 'boolean' ? loop : Boolean(bgm.loop);
            const currentHasBgm = typeof hasBgm === 'boolean' ? hasBgm : Boolean(bgm.audioData);
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));
            const audioAssetId = normalizeAudioAssetId(bgm.audioAssetId);
            const projectDurationSec = scenes.reduce((sum, scene) => sum + Math.max(0, Number(scene?.durationSec) || 0), 0);

            return appendDecision(project, {
              decisionType: 'bgm-fade-in',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                bgmSource: typeof bgmSource === 'string' ? bgmSource.trim() : stringOr(bgm.source).trim(),
                bgmCategory: typeof bgmCategory === 'string' ? bgmCategory.trim() : stringOr(bgm.category).trim(),
                bgmVolume: currentVolume,
                fadeOutSec: currentFadeOut,
                ducking: currentDucking,
                loop: currentLoop,
                hasBgm: currentHasBgm,
                hasNarration,
                sceneCount: scenes.length,
                projectDurationSec
              },
              proposal: { fadeInSec: before },
              alternatives: [],
              humanAction: { type: 'set-bgm-fade-in' },
              finalDecision: { fadeInSec: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'bgm-editor', version: '0.21' },
              assetIds: audioAssetId ? [audioAssetId] : [],
              rights: {}
            }, options);
          }

          ''' + marker
          replace_once('decisionLog.js', marker, helper)

          replace_once(
              'main.js',
              'recordBgmDuckingChange, recordBgmLoopChange, recordBgmSelectionChange, recordBgmVolumeChange',
              'recordBgmDuckingChange, recordBgmFadeInChange, recordBgmLoopChange, recordBgmSelectionChange, recordBgmVolumeChange'
          )
          replace_once(
              'main.js',
              'snapshotGlobalSubtitlePosition, snapshotSceneSubtitlePosition, snapshotSubtitleBackgroundEnabled',
              'snapshotBgmFadeIn, snapshotGlobalSubtitlePosition, snapshotSceneSubtitlePosition, snapshotSubtitleBackgroundEnabled'
          )
          replace_once(
              'main.js',
              "['source','category','bgmTitle','fadeIn','fadeOut','license','credit'].forEach(k=>root.querySelector('#'+k).oninput=()=>{updateLabels();save();});",
              "['source','category','bgmTitle','fadeOut','license','credit'].forEach(k=>root.querySelector('#'+k).oninput=()=>{updateLabels();save();});"
          )

          marker_main = "  const bgmDuckingBeforeByElement=new WeakMap();\n"
          fade_handler = r'''  const bgmFadeInBeforeByElement=new WeakMap();
          const fadeInEl=root.querySelector('#fadeIn');
          const rememberBgmFadeInBefore=el=>{if(bgmFadeInBeforeByElement.has(el))return;bgmFadeInBeforeByElement.set(el,snapshotBgmFadeIn(el.value));};
          const commitBgmFadeInDecision=el=>{if(!bgmFadeInBeforeByElement.has(el))return;const before=bgmFadeInBeforeByElement.get(el);bgmFadeInBeforeByElement.delete(el);const after=snapshotBgmFadeIn(el.value);const record=recordBgmFadeInChange(project,{beforeState:before,afterState:after,bgmSource:root.querySelector('#source').value,bgmCategory:root.querySelector('#category').value,bgmVolume:root.querySelector('#volume').value,fadeOutSec:root.querySelector('#fadeOut').value,ducking:root.querySelector('#ducking').checked,loop:root.querySelector('#loop').checked,hasBgm:Boolean(b.audioData)});if(record)save();};
          fadeInEl.onpointerdown=()=>rememberBgmFadeInBefore(fadeInEl);
          fadeInEl.onfocus=()=>rememberBgmFadeInBefore(fadeInEl);
          fadeInEl.onkeydown=()=>rememberBgmFadeInBefore(fadeInEl);
          fadeInEl.oninput=()=>{updateLabels();save();};
          fadeInEl.onchange=()=>commitBgmFadeInDecision(fadeInEl);
          fadeInEl.onpointerup=()=>commitBgmFadeInDecision(fadeInEl);
          fadeInEl.onpointercancel=()=>bgmFadeInBeforeByElement.delete(fadeInEl);
          fadeInEl.onblur=()=>commitBgmFadeInDecision(fadeInEl);
          ''' + marker_main
          replace_once('main.js', marker_main, fade_handler)

          replace_once(
              'tests/decisionLog.test.mjs',
              '  normalizeBgmVolume,\n',
              '  normalizeBgmFadeSeconds,\n  normalizeBgmVolume,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  recordBgmDuckingChange,\n',
              '  recordBgmDuckingChange,\n  recordBgmFadeInChange,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  snapshotGlobalSubtitlePosition,\n',
              '  snapshotBgmFadeIn,\n  snapshotGlobalSubtitlePosition,\n'
          )

          tests_path = Path('tests/decisionLog.test.mjs')
          tests = tests_path.read_text()
          tests += r'''

          test('BGM fade seconds normalization accepts only 0.5 second UI steps from 0 through 30', () => {
            assert.equal(normalizeBgmFadeSeconds(0), 0);
            assert.equal(normalizeBgmFadeSeconds('1.5'), 1.5);
            assert.equal(normalizeBgmFadeSeconds(30), 30);
            assert.equal(normalizeBgmFadeSeconds(-0.5), null);
            assert.equal(normalizeBgmFadeSeconds(30.5), null);
            assert.equal(normalizeBgmFadeSeconds(1.25), null);
            assert.equal(normalizeBgmFadeSeconds('bad'), null);
            assert.equal(normalizeBgmFadeSeconds(''), null);
            assert.deepEqual(snapshotBgmFadeIn(3.5), {fadeInSec:3.5});
            assert.deepEqual(snapshotBgmFadeIn('legacy'), {fadeInSec:null});
          });

          test('bgm-fade-in records one committed direct adjustment with mix and duration context', () => {
            const audioAssetId=`audio-sha256:${'a'.repeat(64)}`;
            const project={
              id:'p-fade-in',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              bgm:{source:'upload',category:'calm',volume:0.12,fadeInSec:3.5,fadeOutSec:2,ducking:true,loop:true,audioData:'data:audio/wav;base64,AA==',audioAssetId},
              narration:{audioData:''},
              scenes:[{id:'s1',durationSec:4,narration:{audioData:'data:audio/wav;base64,AA=='}},{id:'s2',durationSec:6}]
            };
            const record=recordBgmFadeInChange(project,{
              beforeState:{fadeInSec:1},afterState:{fadeInSec:3.5},bgmSource:'upload',bgmCategory:'calm',bgmVolume:'0.12',fadeOutSec:'2',ducking:true,loop:true,hasBgm:true
            },{createId:()=> 'd-fade-in-1',now:()=> '2026-09-05T06:10:00.000Z'});
            assert.equal(record.decisionType,'bgm-fade-in');
            assert.deepEqual(record.proposal,{fadeInSec:1});
            assert.deepEqual(record.finalDecision,{fadeInSec:3.5});
            assert.deepEqual(record.alternatives,[]);
            assert.deepEqual(record.humanAction,{type:'set-bgm-fade-in'});
            assert.deepEqual(record.source,{type:'human',feature:'bgm-editor',version:'0.21'});
            assert.deepEqual(record.assetIds,[audioAssetId]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{
              platform:'youtube-shorts',aspectRatio:'9:16',bgmSource:'upload',bgmCategory:'calm',bgmVolume:0.12,fadeOutSec:2,
              ducking:true,loop:true,hasBgm:true,hasNarration:true,sceneCount:2,projectDurationSec:10
            });
            assert.equal(project.learning.decisions.length,1);
          });

          test('bgm-fade-in records a valid final value when previous value is legacy or invalid', () => {
            const project={id:'p',learning:{decisions:[]},bgm:{fadeOutSec:2},scenes:[]};
            const record=recordBgmFadeInChange(project,{beforeState:{fadeInSec:'legacy'},afterState:{fadeInSec:0.5}});
            assert.deepEqual(record.proposal,{fadeInSec:null});
            assert.deepEqual(record.finalDecision,{fadeInSec:0.5});
            assert.equal(project.learning.decisions.length,1);
          });

          test('bgm-fade-in ignores unchanged, out-of-range and off-step final values without noise', () => {
            const project={id:'p',learning:{decisions:[]},bgm:{},scenes:[]};
            assert.equal(recordBgmFadeInChange(project,{beforeState:{fadeInSec:1},afterState:{fadeInSec:1}}),null);
            assert.equal(recordBgmFadeInChange(project,{beforeState:{fadeInSec:1},afterState:{fadeInSec:-0.5}}),null);
            assert.equal(recordBgmFadeInChange(project,{beforeState:{fadeInSec:1},afterState:{fadeInSec:30.5}}),null);
            assert.equal(recordBgmFadeInChange(project,{beforeState:{fadeInSec:1},afterState:{fadeInSec:1.25}}),null);
            assert.equal(recordBgmFadeInChange(project,{beforeState:{fadeInSec:1},afterState:{fadeInSec:'bad'}}),null);
            assert.equal(project.learning.decisions.length,0);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          BASE=5f3cd5c5e87f4d047535b76a213ee873880b7047
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html
          test "$(grep -o 'recordBgmFadeInChange(' main.js | wc -l)" -eq 1
          test "$(grep -o "fadeInEl.oninput=()=>{updateLabels();save();}" main.js | wc -l)" -eq 1
          test "$(grep -o "fadeInEl.onchange=()=>commitBgmFadeInDecision(fadeInEl)" main.js | wc -l)" -eq 1
          test "$(grep -o "root.querySelector('#fadeOut').value" main.js | wc -l)" -ge 1
          if grep -F "['source','category','bgmTitle','fadeIn','fadeOut','license','credit']" main.js; then exit 1; fi
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          rm .github/workflows/issue76-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue76-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue76-runner.yml
          git commit -m "Capture BGM fade-in decisions"
          git push origin HEAD:issue-76-bgm-fade-in-v021
