name: Issue 78 Implementation Runner

on:
  push:
    branches:
      - issue-78-bgm-fade-out-v022

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.22 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))

          marker = "export function recordBgmLoopChange(project, {"
          helper = r'''export function snapshotBgmFadeOut(value) {
            return { fadeOutSec: normalizeBgmFadeSeconds(value) };
          }

          export function recordBgmFadeOutChange(project, {
            beforeState,
            afterState,
            bgmSource,
            bgmCategory,
            bgmVolume,
            fadeInSec,
            ducking,
            loop,
            hasBgm
          }, options = {}) {
            const beforeRaw = isRecord(beforeState) ? beforeState.fadeOutSec : beforeState;
            const afterRaw = isRecord(afterState) ? afterState.fadeOutSec : afterState;
            const before = normalizeBgmFadeSeconds(beforeRaw);
            const after = normalizeBgmFadeSeconds(afterRaw);
            if (after === null || before === after) return null;

            const bgm = isRecord(project?.bgm) ? project.bgm : {};
            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const currentVolume = normalizeBgmVolume(bgmVolume ?? bgm.volume);
            const currentFadeIn = normalizeBgmFadeSeconds(fadeInSec ?? bgm.fadeInSec);
            const currentDucking = typeof ducking === 'boolean' ? ducking : Boolean(bgm.ducking);
            const currentLoop = typeof loop === 'boolean' ? loop : Boolean(bgm.loop);
            const currentHasBgm = typeof hasBgm === 'boolean' ? hasBgm : Boolean(bgm.audioData);
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));
            const audioAssetId = normalizeAudioAssetId(bgm.audioAssetId);
            const projectDurationSec = scenes.reduce((sum, scene) => sum + Math.max(0, Number(scene?.durationSec) || 0), 0);

            return appendDecision(project, {
              decisionType: 'bgm-fade-out',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                bgmSource: typeof bgmSource === 'string' ? bgmSource.trim() : stringOr(bgm.source).trim(),
                bgmCategory: typeof bgmCategory === 'string' ? bgmCategory.trim() : stringOr(bgm.category).trim(),
                bgmVolume: currentVolume,
                fadeInSec: currentFadeIn,
                ducking: currentDucking,
                loop: currentLoop,
                hasBgm: currentHasBgm,
                hasNarration,
                sceneCount: scenes.length,
                projectDurationSec
              },
              proposal: { fadeOutSec: before },
              alternatives: [],
              humanAction: { type: 'set-bgm-fade-out' },
              finalDecision: { fadeOutSec: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'bgm-editor', version: '0.22' },
              assetIds: audioAssetId ? [audioAssetId] : [],
              rights: {}
            }, options);
          }

          ''' + marker
          replace_once('decisionLog.js', marker, helper)

          replace_once(
              'main.js',
              'recordBgmDuckingChange, recordBgmFadeInChange, recordBgmLoopChange, recordBgmSelectionChange, recordBgmVolumeChange',
              'recordBgmDuckingChange, recordBgmFadeInChange, recordBgmFadeOutChange, recordBgmLoopChange, recordBgmSelectionChange, recordBgmVolumeChange'
          )
          replace_once(
              'main.js',
              'snapshotBgmFadeIn, snapshotGlobalSubtitlePosition',
              'snapshotBgmFadeIn, snapshotBgmFadeOut, snapshotGlobalSubtitlePosition'
          )
          replace_once(
              'main.js',
              "['source','category','bgmTitle','fadeOut','license','credit'].forEach(k=>root.querySelector('#'+k).oninput=()=>{updateLabels();save();});",
              "['source','category','bgmTitle','license','credit'].forEach(k=>root.querySelector('#'+k).oninput=()=>{updateLabels();save();});"
          )

          marker_main = "  const bgmDuckingBeforeByElement=new WeakMap();\n"
          fade_handler = r'''  const bgmFadeOutBeforeByElement=new WeakMap();
          const fadeOutEl=root.querySelector('#fadeOut');
          const rememberBgmFadeOutBefore=el=>{if(bgmFadeOutBeforeByElement.has(el))return;bgmFadeOutBeforeByElement.set(el,snapshotBgmFadeOut(el.value));};
          const commitBgmFadeOutDecision=el=>{if(!bgmFadeOutBeforeByElement.has(el))return;const before=bgmFadeOutBeforeByElement.get(el);bgmFadeOutBeforeByElement.delete(el);const after=snapshotBgmFadeOut(el.value);const record=recordBgmFadeOutChange(project,{beforeState:before,afterState:after,bgmSource:root.querySelector('#source').value,bgmCategory:root.querySelector('#category').value,bgmVolume:root.querySelector('#volume').value,fadeInSec:root.querySelector('#fadeIn').value,ducking:root.querySelector('#ducking').checked,loop:root.querySelector('#loop').checked,hasBgm:Boolean(b.audioData)});if(record)save();};
          fadeOutEl.onpointerdown=()=>rememberBgmFadeOutBefore(fadeOutEl);
          fadeOutEl.onfocus=()=>rememberBgmFadeOutBefore(fadeOutEl);
          fadeOutEl.onkeydown=()=>rememberBgmFadeOutBefore(fadeOutEl);
          fadeOutEl.oninput=()=>{updateLabels();save();};
          fadeOutEl.onchange=()=>commitBgmFadeOutDecision(fadeOutEl);
          fadeOutEl.onpointerup=()=>commitBgmFadeOutDecision(fadeOutEl);
          fadeOutEl.onpointercancel=()=>bgmFadeOutBeforeByElement.delete(fadeOutEl);
          fadeOutEl.onblur=()=>commitBgmFadeOutDecision(fadeOutEl);
          ''' + marker_main
          replace_once('main.js', marker_main, fade_handler)

          replace_once(
              'tests/decisionLog.test.mjs',
              '  recordBgmFadeInChange,\n  recordBgmLoopChange,\n',
              '  recordBgmFadeInChange,\n  recordBgmFadeOutChange,\n  recordBgmLoopChange,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  snapshotBgmFadeIn,\n  snapshotGlobalSubtitlePosition,\n',
              '  snapshotBgmFadeIn,\n  snapshotBgmFadeOut,\n  snapshotGlobalSubtitlePosition,\n'
          )

          tests_path = Path('tests/decisionLog.test.mjs')
          tests = tests_path.read_text()
          tests += r'''

          test('bgm-fade-out records one committed direct adjustment with mix and duration context', () => {
            const audioAssetId=`audio-sha256:${'b'.repeat(64)}`;
            const project={
              id:'p-fade-out',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              bgm:{source:'upload',category:'emotion',volume:0.18,fadeInSec:1.5,fadeOutSec:4.5,ducking:false,loop:true,audioData:'data:audio/wav;base64,AA==',audioAssetId},
              narration:{audioData:''},
              scenes:[{id:'s1',durationSec:7},{id:'s2',durationSec:8,narration:{audioData:'data:audio/wav;base64,AA=='}}]
            };
            const record=recordBgmFadeOutChange(project,{
              beforeState:{fadeOutSec:2},afterState:{fadeOutSec:4.5},bgmSource:'upload',bgmCategory:'emotion',bgmVolume:'0.18',fadeInSec:'1.5',ducking:false,loop:true,hasBgm:true
            },{createId:()=> 'd-fade-out-1',now:()=> '2026-09-05T08:40:00.000Z'});
            assert.equal(record.decisionType,'bgm-fade-out');
            assert.deepEqual(record.proposal,{fadeOutSec:2});
            assert.deepEqual(record.finalDecision,{fadeOutSec:4.5});
            assert.deepEqual(record.alternatives,[]);
            assert.deepEqual(record.humanAction,{type:'set-bgm-fade-out'});
            assert.deepEqual(record.source,{type:'human',feature:'bgm-editor',version:'0.22'});
            assert.deepEqual(record.assetIds,[audioAssetId]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{
              platform:'youtube-shorts',aspectRatio:'9:16',bgmSource:'upload',bgmCategory:'emotion',bgmVolume:0.18,fadeInSec:1.5,
              ducking:false,loop:true,hasBgm:true,hasNarration:true,sceneCount:2,projectDurationSec:15
            });
            assert.deepEqual(snapshotBgmFadeOut(4.5),{fadeOutSec:4.5});
            assert.equal(project.learning.decisions.length,1);
          });

          test('bgm-fade-out records a valid final value when previous value is legacy or invalid', () => {
            const project={id:'p',learning:{decisions:[]},bgm:{fadeInSec:1},scenes:[]};
            const record=recordBgmFadeOutChange(project,{beforeState:{fadeOutSec:'legacy'},afterState:{fadeOutSec:0.5}});
            assert.deepEqual(record.proposal,{fadeOutSec:null});
            assert.deepEqual(record.finalDecision,{fadeOutSec:0.5});
            assert.deepEqual(snapshotBgmFadeOut('legacy'),{fadeOutSec:null});
            assert.equal(project.learning.decisions.length,1);
          });

          test('bgm-fade-out ignores unchanged, out-of-range and off-step final values without noise', () => {
            const project={id:'p',learning:{decisions:[]},bgm:{},scenes:[]};
            assert.equal(recordBgmFadeOutChange(project,{beforeState:{fadeOutSec:2},afterState:{fadeOutSec:2}}),null);
            assert.equal(recordBgmFadeOutChange(project,{beforeState:{fadeOutSec:2},afterState:{fadeOutSec:-0.5}}),null);
            assert.equal(recordBgmFadeOutChange(project,{beforeState:{fadeOutSec:2},afterState:{fadeOutSec:30.5}}),null);
            assert.equal(recordBgmFadeOutChange(project,{beforeState:{fadeOutSec:2},afterState:{fadeOutSec:2.25}}),null);
            assert.equal(recordBgmFadeOutChange(project,{beforeState:{fadeOutSec:2},afterState:{fadeOutSec:'bad'}}),null);
            assert.equal(project.learning.decisions.length,0);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=992d29b80a1d66d4543305a913e3b6d1542c5d10
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html
          test "$(grep -o 'recordBgmFadeOutChange(' main.js | wc -l)" -eq 1
          test "$(grep -o "fadeOutEl.oninput=()=>{updateLabels();save();}" main.js | wc -l)" -eq 1
          test "$(grep -o "fadeOutEl.onchange=()=>commitBgmFadeOutDecision(fadeOutEl)" main.js | wc -l)" -eq 1
          test "$(grep -o "fadeInEl.oninput=()=>{updateLabels();save();}" main.js | wc -l)" -eq 1
          if grep -F "['source','category','bgmTitle','fadeOut','license','credit']" main.js; then exit 1; fi
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue78-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue78-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue78-runner.yml
          git commit -m "Capture BGM fade-out decisions"
          git push origin HEAD:issue-78-bgm-fade-out-v022
