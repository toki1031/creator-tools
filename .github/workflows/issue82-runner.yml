name: Issue 82 Implementation Runner

on:
  push:
    branches:
      - issue-82-subtitle-enabled-v024

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.24 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          marker = "export function normalizeSubtitleFontSize(value) {"
          helper = r'''export function normalizeSubtitleEnabled(value) {
            return typeof value === 'boolean' ? value : null;
          }

          export function snapshotSubtitleEnabled(value) {
            return { subtitleEnabled: normalizeSubtitleEnabled(value) };
          }

          export function recordSubtitleEnabledChange(project, { beforeState, afterState }, options = {}) {
            const beforeRaw = isRecord(beforeState) ? beforeState.subtitleEnabled : beforeState;
            const afterRaw = isRecord(afterState) ? afterState.subtitleEnabled : afterState;
            const before = normalizeSubtitleEnabled(beforeRaw);
            const after = normalizeSubtitleEnabled(afterRaw);
            if (after === null || before === after) return null;

            const style = isRecord(project?.subtitleStyle) ? project.subtitleStyle : {};
            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const subtitleSceneCount = scenes.filter(scene => scene?.subtitleEnabled !== false && stringOr(scene?.subtitleText).trim()).length;
            const positionValue = stringOr(style.position).trim();
            const position = ['top', 'center', 'bottom'].includes(positionValue) ? positionValue : '';
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));

            return appendDecision(project, {
              decisionType: 'subtitle-enabled',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                subtitlePreset: stringOr(style.preset).trim() || 'standard',
                fontSizePx: normalizeSubtitleFontSize(style.fontSize),
                position,
                positionOffsetPercent: normalizeSubtitleOffset(style.positionOffsetPercent),
                maxCharsPerLine: normalizeSubtitleMaxChars(style.maxCharsPerLine),
                maxLines: normalizeSubtitleMaxLines(style.maxLines),
                textColor: stringOr(style.textColor).trim(),
                outlineColor: stringOr(style.outlineColor).trim(),
                outlineWidth: normalizeSubtitleOutlineWidth(style.outlineWidth),
                backgroundEnabled: normalizeSubtitleBackgroundEnabled(style.backgroundEnabled),
                backgroundColor: stringOr(style.backgroundColor).trim(),
                backgroundOpacity: normalizeSubtitleBackgroundOpacityDisplay(style.backgroundOpacity),
                sceneCount: scenes.length,
                subtitleSceneCount,
                hasNarration
              },
              proposal: { subtitleEnabled: before },
              alternatives: [{ subtitleEnabled: !after }],
              humanAction: { type: 'set-subtitle-enabled' },
              finalDecision: { subtitleEnabled: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'subtitle-editor', version: '0.24' },
              assetIds: [],
              rights: {}
            }, options);
          }

          ''' + marker
          replace_once('decisionLog.js', marker, helper)

          replace_once(
              'main.js',
              'recordSubtitleContentChange, recordSubtitleBackgroundEnabledChange, recordSubtitleBackgroundOpacityChange, recordSubtitleFontSizeChange',
              'recordSubtitleContentChange, recordSubtitleBackgroundEnabledChange, recordSubtitleBackgroundOpacityChange, recordSubtitleEnabledChange, recordSubtitleFontSizeChange'
          )
          replace_once(
              'main.js',
              'snapshotSubtitleBackgroundEnabled, snapshotSubtitleBackgroundOpacity, snapshotSubtitleFontSize',
              'snapshotSubtitleBackgroundEnabled, snapshotSubtitleBackgroundOpacity, snapshotSubtitleEnabled, snapshotSubtitleFontSize'
          )
          replace_once(
              'main.js',
              "['subtitleEnabled','textColor','outlineColor','backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});",
              "['textColor','outlineColor','backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});"
          )

          marker_main = "  const subtitleBackgroundOpacityBeforeByElement=new WeakMap();\n"
          enabled_handler = r'''  const subtitleEnabledBeforeByElement=new WeakMap();
          const subtitleEnabledEl=root.querySelector('#subtitleEnabled');
          const rememberSubtitleEnabledBefore=el=>{if(subtitleEnabledBeforeByElement.has(el))return;subtitleEnabledBeforeByElement.set(el,snapshotSubtitleEnabled(Boolean(el.checked)));};
          const commitSubtitleEnabledDecision=el=>{if(!subtitleEnabledBeforeByElement.has(el))return;const before=subtitleEnabledBeforeByElement.get(el);subtitleEnabledBeforeByElement.delete(el);const after=snapshotSubtitleEnabled(Boolean(el.checked));const record=recordSubtitleEnabledChange(project,{beforeState:before,afterState:after});if(record)save();};
          subtitleEnabledEl.onpointerdown=()=>rememberSubtitleEnabledBefore(subtitleEnabledEl);
          subtitleEnabledEl.onfocus=()=>rememberSubtitleEnabledBefore(subtitleEnabledEl);
          subtitleEnabledEl.onkeydown=()=>rememberSubtitleEnabledBefore(subtitleEnabledEl);
          subtitleEnabledEl.oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();};
          subtitleEnabledEl.onchange=()=>commitSubtitleEnabledDecision(subtitleEnabledEl);
          subtitleEnabledEl.onpointercancel=()=>subtitleEnabledBeforeByElement.delete(subtitleEnabledEl);
          subtitleEnabledEl.onblur=()=>commitSubtitleEnabledDecision(subtitleEnabledEl);
          ''' + marker_main
          replace_once('main.js', marker_main, enabled_handler)

          replace_once(
              'tests/decisionLog.test.mjs',
              '  normalizeSubtitleBackgroundOpacity,\n',
              '  normalizeSubtitleBackgroundOpacity,\n  normalizeSubtitleEnabled,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  recordSubtitleBackgroundOpacityChange,\n',
              '  recordSubtitleBackgroundOpacityChange,\n  recordSubtitleEnabledChange,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  snapshotSubtitleBackgroundOpacity,\n',
              '  snapshotSubtitleBackgroundOpacity,\n  snapshotSubtitleEnabled,\n'
          )

          tests_path = Path('tests/decisionLog.test.mjs')
          tests = tests_path.read_text()
          tests += r'''

          test('subtitle enabled normalization accepts booleans only', () => {
            assert.equal(normalizeSubtitleEnabled(true), true);
            assert.equal(normalizeSubtitleEnabled(false), false);
            assert.equal(normalizeSubtitleEnabled(1), null);
            assert.equal(normalizeSubtitleEnabled('true'), null);
            assert.equal(normalizeSubtitleEnabled(null), null);
            assert.deepEqual(snapshotSubtitleEnabled(false), { subtitleEnabled: false });
          });

          test('subtitle-enabled records explicit true to false choice with current style context', () => {
            const project={
              id:'p-sub-enabled',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              subtitleStyle:{enabled:false,preset:'standard',fontSize:54,position:'bottom',positionOffsetPercent:3,maxCharsPerLine:16,maxLines:2,textColor:'#ffffff',outlineColor:'#000000',outlineWidth:4,backgroundEnabled:true,backgroundColor:'#111111',backgroundOpacity:0.45},
              scenes:[
                {id:'s1',subtitleText:'字幕あり',narration:{audioData:'data:audio/wav;base64,QQ=='}},
                {id:'s2',subtitleText:'個別OFF',subtitleEnabled:false},
                {id:'s3',subtitleText:''}
              ]
            };
            const record=recordSubtitleEnabledChange(project,{beforeState:{subtitleEnabled:true},afterState:{subtitleEnabled:false}},{createId:()=> 'd-sub-enabled-1',now:()=> '2026-09-05T11:00:00.000Z'});
            assert.equal(record.decisionType,'subtitle-enabled');
            assert.deepEqual(record.proposal,{subtitleEnabled:true});
            assert.deepEqual(record.alternatives,[{subtitleEnabled:true}]);
            assert.deepEqual(record.humanAction,{type:'set-subtitle-enabled'});
            assert.deepEqual(record.finalDecision,{subtitleEnabled:false});
            assert.deepEqual(record.source,{type:'human',feature:'subtitle-editor',version:'0.24'});
            assert.deepEqual(record.assetIds,[]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{
              platform:'youtube-shorts',aspectRatio:'9:16',subtitlePreset:'standard',fontSizePx:54,position:'bottom',positionOffsetPercent:3,
              maxCharsPerLine:16,maxLines:2,textColor:'#ffffff',outlineColor:'#000000',outlineWidth:4,backgroundEnabled:true,backgroundColor:'#111111',backgroundOpacity:0.45,
              sceneCount:3,subtitleSceneCount:1,hasNarration:true
            });
            assert.equal(project.learning.decisions.length,1);
          });

          test('subtitle-enabled records explicit false to true choice and opposite alternative', () => {
            const project={id:'p',platform:'instagram-reels',aspectRatio:'9:16',learning:{decisions:[]},subtitleStyle:{enabled:true},scenes:[]};
            const record=recordSubtitleEnabledChange(project,{beforeState:snapshotSubtitleEnabled(false),afterState:snapshotSubtitleEnabled(true)});
            assert.deepEqual(record.proposal,{subtitleEnabled:false});
            assert.deepEqual(record.finalDecision,{subtitleEnabled:true});
            assert.deepEqual(record.alternatives,[{subtitleEnabled:false}]);
            assert.equal(record.context.subtitlePreset,'standard');
            assert.equal(record.context.sceneCount,0);
          });

          test('subtitle-enabled allows invalid legacy before as null but ignores same and invalid final states', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{enabled:true},scenes:[]};
            const record=recordSubtitleEnabledChange(project,{beforeState:{subtitleEnabled:'legacy'},afterState:{subtitleEnabled:true}});
            assert.deepEqual(record.proposal,{subtitleEnabled:null});
            assert.deepEqual(record.finalDecision,{subtitleEnabled:true});
            assert.equal(recordSubtitleEnabledChange(project,{beforeState:{subtitleEnabled:true},afterState:{subtitleEnabled:true}}),null);
            assert.equal(recordSubtitleEnabledChange(project,{beforeState:{subtitleEnabled:false},afterState:{subtitleEnabled:'false'}}),null);
            assert.equal(project.learning.decisions.length,1);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=bf864ccfb4018d647f9ac1b7b2c245856f07d863
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html styles.css
          test "$(grep -o 'recordSubtitleEnabledChange(' main.js | wc -l)" -eq 1
          test "$(grep -o "subtitleEnabledEl.oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();}" main.js | wc -l)" -eq 1
          test "$(grep -o "project.output.subtitles=st.enabled" main.js | wc -l)" -ge 1
          if grep -F "['subtitleEnabled','textColor','outlineColor','backgroundColor']" main.js; then exit 1; fi
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue82-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue82-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue82-runner.yml
          git commit -m "Capture subtitle enabled decisions"
          git push origin HEAD:issue-82-subtitle-enabled-v024
