name: Issue 84 Corrected Runner

on:
  push:
    branches:
      - issue-84-subtitle-text-color-v025

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reapply Dataset v0.25 patch from bootstrap runner
        shell: bash
        run: |
          set -euo pipefail
          git show dd63ed3302165cba3fc3676218754a262a9669b3:.github/workflows/issue84-runner.yml \
            | sed -n "/python - <<'PY'/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/issue84_apply.py
          test -s /tmp/issue84_apply.py
          python /tmp/issue84_apply.py
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=403986814a1d961d05fec9d3d313b5520bfc611e
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html styles.css
          test "$(grep -F -o 'recordSubtitleTextColorChange(' main.js | wc -l)" -eq 1
          test "$(grep -F -o "textColorEl.oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleTextColorCloseCheck(textColorEl);}" main.js | wc -l)" -eq 1
          test "$(grep -F -o "['outlineColor','backgroundColor']" main.js | wc -l)" -eq 1
          test "$(grep -F -o 'selector(input:open)' main.js | wc -l)" -eq 1
          test "$(grep -F -o "textColorEl.onchange=()=>{if(isColorPickerOpen(textColorEl))return;commitSubtitleTextColorDecision(textColorEl);}" main.js | wc -l)" -eq 1
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue84-runner-fix.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue84-runner-fix.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue84-runner-fix.yml
          git commit -m "Capture subtitle text color decisions"
          git push origin HEAD:issue-84-subtitle-text-color-v025
