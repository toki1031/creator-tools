name: Issue 84 Implementation Runner

on:
  push:
    branches:
      - issue-84-subtitle-text-color-v025

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.25 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          marker = "export function normalizeSubtitleEnabled(value) {"
          helper = r'''export function normalizeSubtitleColor(value) {
            const normalized = typeof value === 'string' ? value.trim() : '';
            return /^#[0-9a-fA-F]{6}$/.test(normalized) ? normalized.toLowerCase() : null;
          }

          export function snapshotSubtitleTextColor(value) {
            return { textColor: normalizeSubtitleColor(value) };
          }

          export function recordSubtitleTextColorChange(project, { beforeState, afterState }, options = {}) {
            const beforeRaw = isRecord(beforeState) ? beforeState.textColor : beforeState;
            const afterRaw = isRecord(afterState) ? afterState.textColor : afterState;
            const before = normalizeSubtitleColor(beforeRaw);
            const after = normalizeSubtitleColor(afterRaw);
            if (after === null || before === after) return null;

            const style = isRecord(project?.subtitleStyle) ? project.subtitleStyle : {};
            const subtitleEnabled = style.enabled !== false;
            if (!subtitleEnabled) return null;

            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const subtitleSceneCount = scenes.filter(scene => scene?.subtitleEnabled !== false && stringOr(scene?.subtitleText).trim()).length;
            const positionValue = stringOr(style.position).trim();
            const position = ['top', 'center', 'bottom'].includes(positionValue) ? positionValue : '';
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));

            return appendDecision(project, {
              decisionType: 'subtitle-text-color',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                subtitleEnabled,
                subtitlePreset: stringOr(style.preset).trim() || 'standard',
                fontSizePx: normalizeSubtitleFontSize(style.fontSize),
                position,
                positionOffsetPercent: normalizeSubtitleOffset(style.positionOffsetPercent),
                maxCharsPerLine: normalizeSubtitleMaxChars(style.maxCharsPerLine),
                maxLines: normalizeSubtitleMaxLines(style.maxLines),
                outlineColor: normalizeSubtitleColor(style.outlineColor),
                outlineWidth: normalizeSubtitleOutlineWidth(style.outlineWidth),
                backgroundEnabled: normalizeSubtitleBackgroundEnabled(style.backgroundEnabled),
                backgroundColor: normalizeSubtitleColor(style.backgroundColor),
                backgroundOpacity: normalizeSubtitleBackgroundOpacityDisplay(style.backgroundOpacity),
                sceneCount: scenes.length,
                subtitleSceneCount,
                hasNarration
              },
              proposal: { textColor: before },
              alternatives: [],
              humanAction: { type: 'set-subtitle-text-color' },
              finalDecision: { textColor: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'subtitle-editor', version: '0.25' },
              assetIds: [],
              rights: {}
            }, options);
          }

          ''' + marker
          replace_once('decisionLog.js', marker, helper)

          replace_once(
              'main.js',
              'recordSubtitleBackgroundOpacityChange, recordSubtitleEnabledChange, recordSubtitleFontSizeChange',
              'recordSubtitleBackgroundOpacityChange, recordSubtitleEnabledChange, recordSubtitleFontSizeChange, recordSubtitleTextColorChange'
          )
          replace_once(
              'main.js',
              'snapshotSubtitleEnabled, snapshotSubtitleFontSize, snapshotSubtitleMaxChars',
              'snapshotSubtitleEnabled, snapshotSubtitleFontSize, snapshotSubtitleMaxChars, snapshotSubtitleTextColor'
          )
          replace_once(
              'main.js',
              "['textColor','outlineColor','backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});",
              "['outlineColor','backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});"
          )

          marker_main = "  const subtitleEnabledBeforeByElement=new WeakMap();\n"
          handler = r'''  const subtitleTextColorBeforeByElement=new WeakMap();
          const textColorEl=root.querySelector('#textColor');
          const supportsOpenPickerState=(()=>{try{return Boolean(globalThis.CSS?.supports?.('selector(input:open)'));}catch{return false;}})();
          const isColorPickerOpen=el=>{if(!supportsOpenPickerState)return false;try{return el.matches(':open');}catch{return false;}};
          let textColorCloseCheck=0;
          const rememberSubtitleTextColorBefore=el=>{if(subtitleTextColorBeforeByElement.has(el))return;subtitleTextColorBeforeByElement.set(el,snapshotSubtitleTextColor(el.value));};
          const commitSubtitleTextColorDecision=el=>{if(!subtitleTextColorBeforeByElement.has(el))return;clearTimeout(textColorCloseCheck);textColorCloseCheck=0;const before=subtitleTextColorBeforeByElement.get(el);subtitleTextColorBeforeByElement.delete(el);const after=snapshotSubtitleTextColor(el.value);const record=recordSubtitleTextColorChange(project,{beforeState:before,afterState:after});if(record)save();};
          const scheduleSubtitleTextColorCloseCheck=el=>{if(!supportsOpenPickerState)return;clearTimeout(textColorCloseCheck);textColorCloseCheck=setTimeout(()=>{textColorCloseCheck=0;if(!isColorPickerOpen(el))commitSubtitleTextColorDecision(el);},300);};
          textColorEl.onpointerdown=()=>rememberSubtitleTextColorBefore(textColorEl);
          textColorEl.onfocus=()=>rememberSubtitleTextColorBefore(textColorEl);
          textColorEl.onkeydown=()=>rememberSubtitleTextColorBefore(textColorEl);
          textColorEl.oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleTextColorCloseCheck(textColorEl);};
          textColorEl.onchange=()=>{if(isColorPickerOpen(textColorEl))return;commitSubtitleTextColorDecision(textColorEl);};
          textColorEl.onpointercancel=()=>{clearTimeout(textColorCloseCheck);textColorCloseCheck=0;subtitleTextColorBeforeByElement.delete(textColorEl);};
          textColorEl.onblur=()=>{if(isColorPickerOpen(textColorEl))return;commitSubtitleTextColorDecision(textColorEl);};
          ''' + marker_main
          replace_once('main.js', marker_main, handler)

          replace_once(
              'tests/decisionLog.test.mjs',
              '  normalizeSubtitleEnabled,\n',
              '  normalizeSubtitleEnabled,\n  normalizeSubtitleColor,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  recordSubtitleEnabledChange,\n',
              '  recordSubtitleEnabledChange,\n  recordSubtitleTextColorChange,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  snapshotSubtitleEnabled,\n',
              '  snapshotSubtitleEnabled,\n  snapshotSubtitleTextColor,\n'
          )

          tests_path = Path('tests/decisionLog.test.mjs')
          tests = tests_path.read_text()
          tests += r'''

          test('subtitle color normalization accepts only six-digit hex and lowercases it', () => {
            assert.equal(normalizeSubtitleColor('#ABCDEF'), '#abcdef');
            assert.equal(normalizeSubtitleColor('#123456'), '#123456');
            assert.equal(normalizeSubtitleColor('#fff'), null);
            assert.equal(normalizeSubtitleColor('#11223344'), null);
            assert.equal(normalizeSubtitleColor('rgb(1,2,3)'), null);
            assert.equal(normalizeSubtitleColor(''), null);
            assert.deepEqual(snapshotSubtitleTextColor('#A1B2C3'), { textColor:'#a1b2c3' });
          });

          test('subtitle-text-color records one active subtitle color choice with compact style context', () => {
            const project={
              id:'p-text-color',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              subtitleStyle:{enabled:true,preset:'standard',fontSize:54,position:'bottom',positionOffsetPercent:-2,maxCharsPerLine:16,maxLines:2,textColor:'#ffcc00',outlineColor:'#FFFFFF',outlineWidth:4,backgroundEnabled:true,backgroundColor:'#111111',backgroundOpacity:0.45},
              scenes:[
                {id:'s1',subtitleText:'字幕あり',narration:{audioData:'data:audio/wav;base64,QQ=='}},
                {id:'s2',subtitleText:'個別OFF',subtitleEnabled:false},
                {id:'s3',subtitleText:''}
              ]
            };
            const record=recordSubtitleTextColorChange(project,{beforeState:{textColor:'#FFFFFF'},afterState:{textColor:'#FFCC00'}},{createId:()=> 'd-text-color-1',now:()=> '2026-09-05T11:20:00.000Z'});
            assert.equal(record.decisionType,'subtitle-text-color');
            assert.deepEqual(record.proposal,{textColor:'#ffffff'});
            assert.deepEqual(record.alternatives,[]);
            assert.deepEqual(record.humanAction,{type:'set-subtitle-text-color'});
            assert.deepEqual(record.finalDecision,{textColor:'#ffcc00'});
            assert.deepEqual(record.source,{type:'human',feature:'subtitle-editor',version:'0.25'});
            assert.deepEqual(record.assetIds,[]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{
              platform:'youtube-shorts',aspectRatio:'9:16',subtitleEnabled:true,subtitlePreset:'standard',fontSizePx:54,position:'bottom',positionOffsetPercent:-2,
              maxCharsPerLine:16,maxLines:2,outlineColor:'#ffffff',outlineWidth:4,backgroundEnabled:true,backgroundColor:'#111111',backgroundOpacity:0.45,
              sceneCount:3,subtitleSceneCount:1,hasNarration:true
            });
            assert.equal(project.learning.decisions.length,1);
          });

          test('subtitle-text-color ignores color edits while global subtitles are disabled', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{enabled:false},scenes:[]};
            const record=recordSubtitleTextColorChange(project,{beforeState:{textColor:'#ffffff'},afterState:{textColor:'#ff0000'}});
            assert.equal(record,null);
            assert.equal(project.learning.decisions.length,0);
          });

          test('subtitle-text-color allows invalid legacy before as null and ignores same or invalid final colors', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{enabled:true},scenes:[]};
            const record=recordSubtitleTextColorChange(project,{beforeState:{textColor:'legacy'},afterState:{textColor:'#00FF00'}});
            assert.deepEqual(record.proposal,{textColor:null});
            assert.deepEqual(record.finalDecision,{textColor:'#00ff00'});
            assert.equal(recordSubtitleTextColorChange(project,{beforeState:{textColor:'#AABBCC'},afterState:{textColor:'#aabbcc'}}),null);
            assert.equal(recordSubtitleTextColorChange(project,{beforeState:{textColor:'#ffffff'},afterState:{textColor:'red'}}),null);
            assert.equal(project.learning.decisions.length,1);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=403986814a1d961d05fec9d3d313b5520bfc611e
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html styles.css
          test "$(grep -o 'recordSubtitleTextColorChange(' main.js | wc -l)" -eq 1
          test "$(grep -o "textColorEl.oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleTextColorCloseCheck(textColorEl);}" main.js | wc -l)" -eq 1
          test "$(grep -o "['outlineColor','backgroundColor']" main.js | wc -l)" -eq 1
          test "$(grep -o "selector(input:open)" main.js | wc -l)" -eq 1
          test "$(grep -o "textColorEl.onchange=()=>{if(isColorPickerOpen(textColorEl))return;commitSubtitleTextColorDecision(textColorEl);}" main.js | wc -l)" -eq 1
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue84-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue84-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue84-runner.yml
          git commit -m "Capture subtitle text color decisions"
          git push origin HEAD:issue-84-subtitle-text-color-v025
