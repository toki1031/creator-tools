name: Issue 84 Safari Fix 2

on:
  push:
    branches:
      - issue-84-subtitle-text-color-v025

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply iPhone Safari color-picker fix
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64;exec(base64.b64decode(''))"
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=403986814a1d961d05fec9d3d313b5520bfc611e
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html styles.css
          grep -F -q "snapshotSubtitleTextColor(st.textColor)" main.js
          grep -F -q "armSubtitleTextColorOutsideCommit();readGlobalSettings()" main.js
          if grep -F -q "textColorEl.onpointercancel" main.js; then exit 1; fi
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue84-safari-fix2.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue84-safari-fix2.yml main.js | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/issue84-safari-fix2.yml
          git commit -m "Fix iPhone Safari subtitle color commit"
          git push origin HEAD:issue-84-subtitle-text-color-v025
