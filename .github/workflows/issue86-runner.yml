name: Issue 86 Implementation Runner

on:
  push:
    branches:
      - issue-86-subtitle-outline-color-v026

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.26 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          marker = "export function normalizeSubtitleEnabled(value) {"
          helper = r'''export function snapshotSubtitleOutlineColor(value) {
            return { outlineColor: normalizeSubtitleColor(value) };
          }

          export function recordSubtitleOutlineColorChange(project, { beforeState, afterState }, options = {}) {
            const beforeRaw = isRecord(beforeState) ? beforeState.outlineColor : beforeState;
            const afterRaw = isRecord(afterState) ? afterState.outlineColor : afterState;
            const before = normalizeSubtitleColor(beforeRaw);
            const after = normalizeSubtitleColor(afterRaw);
            if (after === null || before === after) return null;

            const style = isRecord(project?.subtitleStyle) ? project.subtitleStyle : {};
            const subtitleEnabled = style.enabled !== false;
            const outlineWidth = normalizeSubtitleOutlineWidth(style.outlineWidth);
            if (!subtitleEnabled || outlineWidth === null || outlineWidth <= 0) return null;

            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const subtitleSceneCount = scenes.filter(scene => scene?.subtitleEnabled !== false && stringOr(scene?.subtitleText).trim()).length;
            const positionValue = stringOr(style.position).trim();
            const position = ['top', 'center', 'bottom'].includes(positionValue) ? positionValue : '';
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));

            return appendDecision(project, {
              decisionType: 'subtitle-outline-color',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                subtitleEnabled,
                subtitlePreset: stringOr(style.preset).trim() || 'standard',
                fontSizePx: normalizeSubtitleFontSize(style.fontSize),
                position,
                positionOffsetPercent: normalizeSubtitleOffset(style.positionOffsetPercent),
                maxCharsPerLine: normalizeSubtitleMaxChars(style.maxCharsPerLine),
                maxLines: normalizeSubtitleMaxLines(style.maxLines),
                textColor: normalizeSubtitleColor(style.textColor),
                outlineWidth,
                backgroundEnabled: normalizeSubtitleBackgroundEnabled(style.backgroundEnabled),
                backgroundColor: normalizeSubtitleColor(style.backgroundColor),
                backgroundOpacity: normalizeSubtitleBackgroundOpacityDisplay(style.backgroundOpacity),
                sceneCount: scenes.length,
                subtitleSceneCount,
                hasNarration
              },
              proposal: { outlineColor: before },
              alternatives: [],
              humanAction: { type: 'set-subtitle-outline-color' },
              finalDecision: { outlineColor: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'subtitle-editor', version: '0.26' },
              assetIds: [],
              rights: {}
            }, options);
          }

          ''' + marker
          replace_once('decisionLog.js', marker, helper)

          replace_once(
              'main.js',
              'recordSubtitleFontSizeChange, recordSubtitleTextColorChange, recordSubtitleMaxCharsChange',
              'recordSubtitleFontSizeChange, recordSubtitleTextColorChange, recordSubtitleOutlineColorChange, recordSubtitleMaxCharsChange'
          )
          replace_once(
              'main.js',
              'snapshotSubtitleEnabled, snapshotSubtitleFontSize, snapshotSubtitleMaxChars, snapshotSubtitleTextColor, snapshotSubtitleMaxLines',
              'snapshotSubtitleEnabled, snapshotSubtitleFontSize, snapshotSubtitleMaxChars, snapshotSubtitleTextColor, snapshotSubtitleOutlineColor, snapshotSubtitleMaxLines'
          )
          replace_once(
              'main.js',
              "['outlineColor','backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});",
              "['backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});"
          )

          marker_main = "textColorEl.onblur=()=>{if(isColorPickerOpen(textColorEl))return;commitSubtitleTextColorDecision(textColorEl);};\n"
          outline_handler = marker_main + r'''const subtitleOutlineColorBeforeByElement=new WeakMap();
          const outlineColorEl=root.querySelector('#outlineColor');
          let outlineColorCloseCheck=0;
          let outlineColorOutsideCommitArmed=false;
          const rememberSubtitleOutlineColorBefore=el=>{if(subtitleOutlineColorBeforeByElement.has(el))return;subtitleOutlineColorBeforeByElement.set(el,snapshotSubtitleOutlineColor(st.outlineColor));};
          const commitSubtitleOutlineColorDecision=el=>{if(!subtitleOutlineColorBeforeByElement.has(el))return;clearTimeout(outlineColorCloseCheck);outlineColorCloseCheck=0;const before=subtitleOutlineColorBeforeByElement.get(el);subtitleOutlineColorBeforeByElement.delete(el);const after=snapshotSubtitleOutlineColor(el.value);const record=recordSubtitleOutlineColorChange(project,{beforeState:before,afterState:after});if(record)save();};
          const scheduleSubtitleOutlineColorCloseCheck=el=>{if(!supportsOpenPickerState)return;clearTimeout(outlineColorCloseCheck);outlineColorCloseCheck=setTimeout(()=>{outlineColorCloseCheck=0;if(!isColorPickerOpen(el))commitSubtitleOutlineColorDecision(el);},300);};
          const armSubtitleOutlineColorOutsideCommit=()=>{if(outlineColorOutsideCommitArmed)return;outlineColorOutsideCommitArmed=true;document.addEventListener('pointerdown',()=>{outlineColorOutsideCommitArmed=false;commitSubtitleOutlineColorDecision(outlineColorEl);},{capture:true,once:true});};
          outlineColorEl.onpointerdown=()=>rememberSubtitleOutlineColorBefore(outlineColorEl);
          outlineColorEl.onfocus=()=>rememberSubtitleOutlineColorBefore(outlineColorEl);
          outlineColorEl.onkeydown=()=>rememberSubtitleOutlineColorBefore(outlineColorEl);
          outlineColorEl.oninput=()=>{rememberSubtitleOutlineColorBefore(outlineColorEl);armSubtitleOutlineColorOutsideCommit();readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleOutlineColorCloseCheck(outlineColorEl);};
          outlineColorEl.onchange=()=>{if(isColorPickerOpen(outlineColorEl))return;commitSubtitleOutlineColorDecision(outlineColorEl);};
          outlineColorEl.onblur=()=>{if(isColorPickerOpen(outlineColorEl))return;commitSubtitleOutlineColorDecision(outlineColorEl);};
          '''
          replace_once('main.js', marker_main, outline_handler)

          replace_once(
              'tests/decisionLog.test.mjs',
              '  recordSubtitleTextColorChange,\n',
              '  recordSubtitleTextColorChange,\n  recordSubtitleOutlineColorChange,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  snapshotSubtitleTextColor,\n',
              '  snapshotSubtitleTextColor,\n  snapshotSubtitleOutlineColor,\n'
          )

          tests_path = Path('tests/decisionLog.test.mjs')
          tests = tests_path.read_text()
          tests += r'''

          test('subtitle outline color snapshot reuses normalized six-digit hex colors', () => {
            assert.deepEqual(snapshotSubtitleOutlineColor('#A1B2C3'), { outlineColor: '#a1b2c3' });
            assert.deepEqual(snapshotSubtitleOutlineColor('#fff'), { outlineColor: null });
          });

          test('subtitle-outline-color records an explicit visible outline color choice', () => {
            const project={
              id:'p-outline-color',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              subtitleStyle:{enabled:true,preset:'standard',fontSize:54,position:'bottom',positionOffsetPercent:2,maxCharsPerLine:16,maxLines:2,textColor:'#ffffff',outlineColor:'#00ff00',outlineWidth:4,backgroundEnabled:true,backgroundColor:'#111111',backgroundOpacity:0.45},
              scenes:[
                {id:'s1',subtitleText:'字幕あり',narration:{audioData:'data:audio/wav;base64,QQ=='}},
                {id:'s2',subtitleText:'個別OFF',subtitleEnabled:false}
              ]
            };
            const record=recordSubtitleOutlineColorChange(project,{beforeState:{outlineColor:'#000000'},afterState:{outlineColor:'#00FF00'}},{createId:()=> 'd-outline-color-1',now:()=> '2026-09-05T15:30:00.000Z'});
            assert.equal(record.decisionType,'subtitle-outline-color');
            assert.deepEqual(record.proposal,{outlineColor:'#000000'});
            assert.deepEqual(record.finalDecision,{outlineColor:'#00ff00'});
            assert.deepEqual(record.alternatives,[]);
            assert.deepEqual(record.humanAction,{type:'set-subtitle-outline-color'});
            assert.deepEqual(record.source,{type:'human',feature:'subtitle-editor',version:'0.26'});
            assert.deepEqual(record.assetIds,[]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{
              platform:'youtube-shorts',aspectRatio:'9:16',subtitleEnabled:true,subtitlePreset:'standard',fontSizePx:54,position:'bottom',positionOffsetPercent:2,
              maxCharsPerLine:16,maxLines:2,textColor:'#ffffff',outlineWidth:4,backgroundEnabled:true,backgroundColor:'#111111',backgroundOpacity:0.45,
              sceneCount:2,subtitleSceneCount:1,hasNarration:true
            });
            assert.equal(project.learning.decisions.length,1);
          });

          test('subtitle-outline-color allows invalid legacy before as null for a valid visible final', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{enabled:true,outlineWidth:3,textColor:'#ffffff'},scenes:[]};
            const record=recordSubtitleOutlineColorChange(project,{beforeState:{outlineColor:'legacy'},afterState:{outlineColor:'#123456'}});
            assert.deepEqual(record.proposal,{outlineColor:null});
            assert.deepEqual(record.finalDecision,{outlineColor:'#123456'});
            assert.equal(project.learning.decisions.length,1);
          });

          test('subtitle-outline-color ignores hidden, zero-width, same, and invalid final choices', () => {
            const hidden={id:'hidden',learning:{decisions:[]},subtitleStyle:{enabled:false,outlineWidth:4},scenes:[]};
            assert.equal(recordSubtitleOutlineColorChange(hidden,{beforeState:{outlineColor:'#000000'},afterState:{outlineColor:'#ffffff'}}),null);
            const zero={id:'zero',learning:{decisions:[]},subtitleStyle:{enabled:true,outlineWidth:0},scenes:[]};
            assert.equal(recordSubtitleOutlineColorChange(zero,{beforeState:{outlineColor:'#000000'},afterState:{outlineColor:'#ffffff'}}),null);
            const visible={id:'visible',learning:{decisions:[]},subtitleStyle:{enabled:true,outlineWidth:2},scenes:[]};
            assert.equal(recordSubtitleOutlineColorChange(visible,{beforeState:{outlineColor:'#abcdef'},afterState:{outlineColor:'#ABCDEF'}}),null);
            assert.equal(recordSubtitleOutlineColorChange(visible,{beforeState:{outlineColor:'#000000'},afterState:{outlineColor:'rgb(1,2,3)'}}),null);
            assert.equal(visible.learning.decisions.length,0);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=f51b95ae2140e9255a45d1c3960e895cd470c338
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html styles.css
          test "$(grep -F -o 'recordSubtitleOutlineColorChange(' main.js | wc -l)" -eq 1
          test "$(grep -F -o "outlineColorEl.oninput=()=>{rememberSubtitleOutlineColorBefore(outlineColorEl);armSubtitleOutlineColorOutsideCommit();readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleOutlineColorCloseCheck(outlineColorEl);}" main.js | wc -l)" -eq 1
          test "$(grep -F -o "['backgroundColor'].forEach" main.js | wc -l)" -eq 1
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue86-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue86-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue86-runner.yml
          git commit -m "Capture subtitle outline color decisions"
          git push origin HEAD:issue-86-subtitle-outline-color-v026
