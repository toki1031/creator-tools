name: Issue 88 Implementation Runner

on:
  push:
    branches:
      - issue-88-subtitle-background-color-v027

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Dataset v0.27 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1))

          marker = "export function normalizeSubtitleEnabled(value) {"
          helper = r'''export function snapshotSubtitleBackgroundColor(value) {
            return { backgroundColor: normalizeSubtitleColor(value) };
          }

          export function recordSubtitleBackgroundColorChange(project, { beforeState, afterState }, options = {}) {
            const beforeRaw = isRecord(beforeState) ? beforeState.backgroundColor : beforeState;
            const afterRaw = isRecord(afterState) ? afterState.backgroundColor : afterState;
            const before = normalizeSubtitleColor(beforeRaw);
            const after = normalizeSubtitleColor(afterRaw);
            if (after === null || before === after) return null;

            const style = isRecord(project?.subtitleStyle) ? project.subtitleStyle : {};
            const subtitleEnabled = style.enabled !== false;
            const backgroundEnabled = normalizeSubtitleBackgroundEnabled(style.backgroundEnabled);
            const backgroundOpacity = normalizeSubtitleBackgroundOpacityDisplay(style.backgroundOpacity);
            if (!subtitleEnabled || backgroundEnabled !== true || backgroundOpacity === null || backgroundOpacity <= 0) return null;

            const scenes = Array.isArray(project?.scenes) ? project.scenes : [];
            const subtitleSceneCount = scenes.filter(scene => scene?.subtitleEnabled !== false && stringOr(scene?.subtitleText).trim()).length;
            const positionValue = stringOr(style.position).trim();
            const position = ['top', 'center', 'bottom'].includes(positionValue) ? positionValue : '';
            const hasNarration = Boolean(project?.narration?.audioData) || scenes.some(scene => Boolean(scene?.narration?.audioData));

            return appendDecision(project, {
              decisionType: 'subtitle-background-color',
              sceneId: '',
              context: {
                platform: stringOr(project?.platform),
                aspectRatio: stringOr(project?.aspectRatio),
                subtitleEnabled,
                subtitlePreset: stringOr(style.preset).trim() || 'standard',
                fontSizePx: normalizeSubtitleFontSize(style.fontSize),
                position,
                positionOffsetPercent: normalizeSubtitleOffset(style.positionOffsetPercent),
                maxCharsPerLine: normalizeSubtitleMaxChars(style.maxCharsPerLine),
                maxLines: normalizeSubtitleMaxLines(style.maxLines),
                textColor: normalizeSubtitleColor(style.textColor),
                outlineColor: normalizeSubtitleColor(style.outlineColor),
                outlineWidth: normalizeSubtitleOutlineWidth(style.outlineWidth),
                backgroundEnabled: true,
                backgroundOpacity,
                sceneCount: scenes.length,
                subtitleSceneCount,
                hasNarration
              },
              proposal: { backgroundColor: before },
              alternatives: [],
              humanAction: { type: 'set-subtitle-background-color' },
              finalDecision: { backgroundColor: after },
              reasonCode: '',
              reasonNote: '',
              source: { type: 'human', feature: 'subtitle-editor', version: '0.27' },
              assetIds: [],
              rights: {}
            }, options);
          }

          ''' + marker
          replace_once('decisionLog.js', marker, helper)

          replace_once(
              'main.js',
              'recordSubtitleTextColorChange, recordSubtitleOutlineColorChange, recordSubtitleMaxCharsChange',
              'recordSubtitleTextColorChange, recordSubtitleOutlineColorChange, recordSubtitleBackgroundColorChange, recordSubtitleMaxCharsChange'
          )
          replace_once(
              'main.js',
              'snapshotSubtitleMaxChars, snapshotSubtitleTextColor, snapshotSubtitleOutlineColor, snapshotSubtitleMaxLines',
              'snapshotSubtitleMaxChars, snapshotSubtitleTextColor, snapshotSubtitleOutlineColor, snapshotSubtitleBackgroundColor, snapshotSubtitleMaxLines'
          )
          replace_once(
              'main.js',
              "  ['backgroundColor'].forEach(k=>root.querySelector('#'+k).oninput=()=>{readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();});\n",
              ''
          )

          marker_main = "outlineColorEl.onblur=()=>{if(isColorPickerOpen(outlineColorEl))return;commitSubtitleOutlineColorDecision(outlineColorEl);};\n"
          bg_handler = marker_main + r'''const subtitleBackgroundColorBeforeByElement=new WeakMap();
          const backgroundColorEl=root.querySelector('#backgroundColor');
          let backgroundColorCloseCheck=0;
          let backgroundColorOutsideCommitArmed=false;
          const rememberSubtitleBackgroundColorBefore=el=>{if(subtitleBackgroundColorBeforeByElement.has(el))return;subtitleBackgroundColorBeforeByElement.set(el,snapshotSubtitleBackgroundColor(st.backgroundColor));};
          const commitSubtitleBackgroundColorDecision=el=>{if(!subtitleBackgroundColorBeforeByElement.has(el))return;clearTimeout(backgroundColorCloseCheck);backgroundColorCloseCheck=0;const before=subtitleBackgroundColorBeforeByElement.get(el);subtitleBackgroundColorBeforeByElement.delete(el);const after=snapshotSubtitleBackgroundColor(el.value);const record=recordSubtitleBackgroundColorChange(project,{beforeState:before,afterState:after});if(record)save();};
          const scheduleSubtitleBackgroundColorCloseCheck=el=>{if(!supportsOpenPickerState)return;clearTimeout(backgroundColorCloseCheck);backgroundColorCloseCheck=setTimeout(()=>{backgroundColorCloseCheck=0;if(!isColorPickerOpen(el))commitSubtitleBackgroundColorDecision(el);},300);};
          const armSubtitleBackgroundColorOutsideCommit=()=>{if(backgroundColorOutsideCommitArmed)return;backgroundColorOutsideCommitArmed=true;document.addEventListener('pointerdown',()=>{backgroundColorOutsideCommitArmed=false;commitSubtitleBackgroundColorDecision(backgroundColorEl);},{capture:true,once:true});};
          backgroundColorEl.onpointerdown=()=>rememberSubtitleBackgroundColorBefore(backgroundColorEl);
          backgroundColorEl.onfocus=()=>rememberSubtitleBackgroundColorBefore(backgroundColorEl);
          backgroundColorEl.onkeydown=()=>rememberSubtitleBackgroundColorBefore(backgroundColorEl);
          backgroundColorEl.oninput=()=>{rememberSubtitleBackgroundColorBefore(backgroundColorEl);armSubtitleBackgroundColorOutsideCommit();readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleBackgroundColorCloseCheck(backgroundColorEl);};
          backgroundColorEl.onchange=()=>{if(isColorPickerOpen(backgroundColorEl))return;commitSubtitleBackgroundColorDecision(backgroundColorEl);};
          backgroundColorEl.onblur=()=>{if(isColorPickerOpen(backgroundColorEl))return;commitSubtitleBackgroundColorDecision(backgroundColorEl);};
          '''
          replace_once('main.js', marker_main, bg_handler)

          replace_once(
              'tests/decisionLog.test.mjs',
              '  recordSubtitleOutlineColorChange,\n',
              '  recordSubtitleOutlineColorChange,\n  recordSubtitleBackgroundColorChange,\n'
          )
          replace_once(
              'tests/decisionLog.test.mjs',
              '  snapshotSubtitleOutlineColor,\n',
              '  snapshotSubtitleOutlineColor,\n  snapshotSubtitleBackgroundColor,\n'
          )

          tests_path = Path('tests/decisionLog.test.mjs')
          tests = tests_path.read_text()
          tests += r'''

          test('subtitle background color snapshot reuses normalized six-digit hex colors', () => {
            assert.deepEqual(snapshotSubtitleBackgroundColor('#A1B2C3'), { backgroundColor: '#a1b2c3' });
            assert.deepEqual(snapshotSubtitleBackgroundColor('#fff'), { backgroundColor: null });
          });

          test('subtitle-background-color records an explicit visible background color choice', () => {
            const project={
              id:'p-bg-color',platform:'youtube-shorts',aspectRatio:'9:16',learning:{decisions:[]},
              subtitleStyle:{enabled:true,preset:'boxed',fontSize:52,position:'bottom',positionOffsetPercent:2,maxCharsPerLine:16,maxLines:2,textColor:'#ffffff',outlineColor:'#000000',outlineWidth:0,backgroundEnabled:true,backgroundColor:'#123456',backgroundOpacity:0.58},
              scenes:[
                {id:'s1',subtitleText:'字幕あり',narration:{audioData:'data:audio/wav;base64,QQ=='}},
                {id:'s2',subtitleText:'個別OFF',subtitleEnabled:false}
              ]
            };
            const record=recordSubtitleBackgroundColorChange(project,{beforeState:{backgroundColor:'#000000'},afterState:{backgroundColor:'#123456'}},{createId:()=> 'd-bg-color-1',now:()=> '2026-09-06T02:00:00.000Z'});
            assert.equal(record.decisionType,'subtitle-background-color');
            assert.deepEqual(record.proposal,{backgroundColor:'#000000'});
            assert.deepEqual(record.finalDecision,{backgroundColor:'#123456'});
            assert.deepEqual(record.alternatives,[]);
            assert.deepEqual(record.humanAction,{type:'set-subtitle-background-color'});
            assert.deepEqual(record.source,{type:'human',feature:'subtitle-editor',version:'0.27'});
            assert.deepEqual(record.assetIds,[]);
            assert.deepEqual(record.rights,{});
            assert.deepEqual(record.context,{
              platform:'youtube-shorts',aspectRatio:'9:16',subtitleEnabled:true,subtitlePreset:'boxed',fontSizePx:52,position:'bottom',positionOffsetPercent:2,
              maxCharsPerLine:16,maxLines:2,textColor:'#ffffff',outlineColor:'#000000',outlineWidth:0,backgroundEnabled:true,backgroundOpacity:0.58,
              sceneCount:2,subtitleSceneCount:1,hasNarration:true
            });
            assert.equal(project.learning.decisions.length,1);
          });

          test('subtitle-background-color allows invalid legacy before as null for a valid visible final', () => {
            const project={id:'p',learning:{decisions:[]},subtitleStyle:{enabled:true,backgroundEnabled:true,backgroundOpacity:0.45},scenes:[]};
            const record=recordSubtitleBackgroundColorChange(project,{beforeState:{backgroundColor:'legacy'},afterState:{backgroundColor:'#ABCDEF'}});
            assert.deepEqual(record.proposal,{backgroundColor:null});
            assert.deepEqual(record.finalDecision,{backgroundColor:'#abcdef'});
            assert.equal(project.learning.decisions.length,1);
          });

          test('subtitle-background-color ignores hidden, disabled, transparent, same, and invalid final choices', () => {
            const hidden={id:'hidden',learning:{decisions:[]},subtitleStyle:{enabled:false,backgroundEnabled:true,backgroundOpacity:0.45},scenes:[]};
            assert.equal(recordSubtitleBackgroundColorChange(hidden,{beforeState:{backgroundColor:'#000000'},afterState:{backgroundColor:'#ffffff'}}),null);
            const disabled={id:'disabled',learning:{decisions:[]},subtitleStyle:{enabled:true,backgroundEnabled:false,backgroundOpacity:0.45},scenes:[]};
            assert.equal(recordSubtitleBackgroundColorChange(disabled,{beforeState:{backgroundColor:'#000000'},afterState:{backgroundColor:'#ffffff'}}),null);
            const transparent={id:'transparent',learning:{decisions:[]},subtitleStyle:{enabled:true,backgroundEnabled:true,backgroundOpacity:0},scenes:[]};
            assert.equal(recordSubtitleBackgroundColorChange(transparent,{beforeState:{backgroundColor:'#000000'},afterState:{backgroundColor:'#ffffff'}}),null);
            const visible={id:'visible',learning:{decisions:[]},subtitleStyle:{enabled:true,backgroundEnabled:true,backgroundOpacity:0.45},scenes:[]};
            assert.equal(recordSubtitleBackgroundColorChange(visible,{beforeState:{backgroundColor:'#abcdef'},afterState:{backgroundColor:'#ABCDEF'}}),null);
            assert.equal(recordSubtitleBackgroundColorChange(visible,{beforeState:{backgroundColor:'#000000'},afterState:{backgroundColor:'rgb(1,2,3)'}}),null);
            assert.equal(visible.learning.decisions.length,0);
          });
          '''
          tests_path.write_text(tests)
          PY
      - name: Install dependencies without repository artifacts
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff and scope checks
        shell: bash
        run: |
          set -euo pipefail
          BASE=70fa0cf60a5ac11a70919af453e71d75c57f22a9
          git diff --check
          git diff --exit-code "$BASE" -- videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html styles.css
          test "$(grep -F -o 'recordSubtitleBackgroundColorChange(' main.js | wc -l)" -eq 1
          test "$(grep -F -o "backgroundColorEl.oninput=()=>{rememberSubtitleBackgroundColorBefore(backgroundColorEl);armSubtitleBackgroundColorOutsideCommit();readGlobalSettings();updateLabels();renderSubtitleEditor();renderSubtitlePreview();save();scheduleSubtitleBackgroundColorCloseCheck(backgroundColorEl);}" main.js | wc -l)" -eq 1
          if grep -F "['backgroundColor'].forEach" main.js; then exit 1; fi
      - name: Commit intended changes and remove runner
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue88-runner.yml
          rm -rf dist node_modules package-lock.json
          git clean -fdx
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/issue88-runner.yml decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          printf 'changed:\n%s\nexpected:\n%s\n' "$changed" "$expected"
          test "$changed" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decisionLog.js main.js tests/decisionLog.test.mjs .github/workflows/issue88-runner.yml
          git commit -m "Capture subtitle background color decisions"
          git push origin HEAD:issue-88-subtitle-background-color-v027
