name: Issue 90 branch runner fix
on:
  push:
    branches: [issue-90-final-review-approval-v028]
permissions:
  contents: write
jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded v0.28 changes from original runner payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          text = Path('.github/workflows/issue90-runner.yml').read_text()
          match = re.search(r"base64\.b64decode\('([^']+)'\)", text)
          assert match, 'encoded implementation payload missing'
          exec(base64.b64decode(match.group(1)), {'__name__':'__main__'})
          PY
      - name: Install dependencies without lockfile changes
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff safety checks
        shell: bash
        run: |
          git diff --check
          git add -N decisionLog.js main.js tests/decisionLog.test.mjs
          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' 'decisionLog.js' 'main.js' 'tests/decisionLog.test.mjs' | sort)"
          test "$changed" = "$expected"
          for protected in videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html style.css styles.css package.json; do
            git diff --quiet HEAD -- "$protected" || { echo "Protected file changed: $protected"; exit 1; }
          done
          rm -rf node_modules dist package-lock.json
          rm .github/workflows/issue90-runner.yml .github/workflows/issue90-runner-fix.yml
          git diff --check
          changed="$(git status --short | sed -E 's/^...//' | sort)"
          expected="$(printf '%s\n' '.github/workflows/issue90-runner-fix.yml' '.github/workflows/issue90-runner.yml' 'decisionLog.js' 'main.js' 'tests/decisionLog.test.mjs' | sort)"
          test "$changed" = "$expected"
      - name: Commit implementation and remove runners
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decisionLog.js main.js tests/decisionLog.test.mjs
          git add -u .github/workflows/issue90-runner.yml .github/workflows/issue90-runner-fix.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/issue90-runner-fix.yml' '.github/workflows/issue90-runner.yml' 'decisionLog.js' 'main.js' 'tests/decisionLog.test.mjs' | sort)"
          git commit -m 'Capture final review approvals'
          git push
