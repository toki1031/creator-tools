name: Issue 92 publish export shape fix
on:
  push:
    branches: [issue-92-publish-metadata-approval-v029]
permissions:
  contents: write
jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve legacy publish JSON shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('main.js')
          text=path.read_text()
          old="root.querySelector('#exportJson').onclick=()=>downloadJson(`${safeName(project.title)}-publish.json`,p);"
          new="root.querySelector('#exportJson').onclick=()=>downloadJson(`${safeName(project.title)}-publish.json`,{title:p.title,description:p.description,tags:p.tags,thumbnailText:p.thumbnailText,visibility:p.visibility});"
          assert old in text, 'publish export marker missing'
          assert new not in text, 'publish export already fixed'
          path.write_text(text.replace(old,new,1))
          PY
      - name: Install dependencies without lockfile changes
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Safety and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only HEAD -- main.js)" = "main.js"
          for protected in videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html style.css styles.css package.json; do
            git diff --quiet HEAD -- "$protected" || { echo "Protected file changed: $protected"; exit 1; }
          done
          rm -rf node_modules dist package-lock.json
          rm .github/workflows/issue92-export-shape-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.js
          git add -u .github/workflows/issue92-export-shape-fix.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/issue92-export-shape-fix.yml' 'main.js' | sort)"
          git commit -m 'Preserve publish JSON export shape'
          git push
