name: Issue 92 branch runner
on:
  push:
    branches: [issue-92-publish-metadata-approval-v029]
permissions:
  contents: write
jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded v0.29 changes
        run: |
          python -c "from pathlib import Path; p=Path('.github/issue92_patch.py'); p.write_text(p.read_text().replace(chr(92)+chr(34), chr(34)))"
          python .github/issue92_patch.py
      - name: Install dependencies without lockfile changes
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff safety checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only HEAD -- decisionLog.js main.js tests/decisionLog.test.mjs | sort)"
          expected="$(printf '%s\n' 'decisionLog.js' 'main.js' 'tests/decisionLog.test.mjs' | sort)"
          test "$changed" = "$expected"
          for protected in videoRenderer.js db.js projectFactory.js subtitlePosition.js qualityLogic.js projectBackup.js audioAssetIdentity.js voice-lab.html style.css styles.css package.json; do
            git diff --quiet HEAD -- "$protected" || { echo "Protected file changed: $protected"; exit 1; }
          done
          rm -rf node_modules dist package-lock.json
          rm .github/issue92_patch.py .github/workflows/issue92-runner.yml
          git diff --check
          actual="$(git status --porcelain | cut -c4- | sort)"
          expected_status="$(printf '%s\n' '.github/issue92_patch.py' '.github/workflows/issue92-runner.yml' 'decisionLog.js' 'main.js' 'tests/decisionLog.test.mjs' | sort)"
          test "$actual" = "$expected_status"
      - name: Commit implementation and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add decisionLog.js main.js tests/decisionLog.test.mjs
          git add -u .github/issue92_patch.py .github/workflows/issue92-runner.yml
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/issue92_patch.py' '.github/workflows/issue92-runner.yml' 'decisionLog.js' 'main.js' 'tests/decisionLog.test.mjs' | sort)"
          test "$actual" = "$expected"
          git commit -m 'Capture publish metadata approvals'
          git push
