name: Patch iOS safe export
on:
  push:
    branches:
      - v1.4/fix-narration-performance-shorts-limit
    paths:
      - .github/workflows/patch-ios-safe-export.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4/fix-narration-performance-shorts-limit
      - name: Patch iPhone safe export profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('videoRenderer.js')
          s=p.read_text()
          old="function bitrateFor(project) { const width = Number(project.output?.width) || 720; const high = project.output?.quality === 'high'; if (width >= 1080) return high ? 8_000_000 : 5_000_000; return high ? 5_000_000 : 3_000_000; }\n"
          new="""function isIOSDevice(userAgent = globalThis.navigator?.userAgent || '') { return /iPhone|iPad|iPod/i.test(String(userAgent)); }

          export function resolveExportProfile(project, { userAgent = globalThis.navigator?.userAgent || '' } = {}) {
            const requestedWidth = Math.max(2, Number(project?.output?.width) || 720);
            const requestedHeight = Math.max(2, Number(project?.output?.height) || 1280);
            const iosSafeMode = isIOSDevice(userAgent);
            const maxPixels = 720 * 1280;
            if (!iosSafeMode || requestedWidth * requestedHeight <= maxPixels) {
              return { requestedWidth, requestedHeight, width: requestedWidth, height: requestedHeight, iosSafeMode: false };
            }
            const scale = Math.sqrt(maxPixels / (requestedWidth * requestedHeight));
            const even = value => Math.max(2, Math.round(value / 2) * 2);
            return { requestedWidth, requestedHeight, width: even(requestedWidth * scale), height: even(requestedHeight * scale), iosSafeMode: true };
          }

          function bitrateFor(project, exportWidth, iosSafeMode = false) {
            if (iosSafeMode) return 3_000_000;
            const width = Number(exportWidth) || Number(project.output?.width) || 720;
            const high = project.output?.quality === 'high';
            if (width >= 1080) return high ? 8_000_000 : 5_000_000;
            return high ? 5_000_000 : 3_000_000;
          }
          """
          assert old in s, 'bitrate block not found'
          s=s.replace(old,new,1)
          old="  const fps = clamp(Number(project.output?.fps) || 30, 1, 60);\n  canvas.width = Number(project.output?.width) || 720; canvas.height = Number(project.output?.height) || 1280;\n  await ensurePreparedImageWindow(project, prepared, 0, { onStatus });\n"
          new="  const exportProfile = resolveExportProfile(project);\n  const fps = clamp(Number(project.output?.fps) || 30, 1, exportProfile.iosSafeMode ? 30 : 60);\n  canvas.width = exportProfile.width; canvas.height = exportProfile.height;\n  if (exportProfile.iosSafeMode) onStatus(`iPhone safe mode: ${exportProfile.width}x${exportProfile.height} / ${fps}fps`);\n  await ensurePreparedImageWindow(project, prepared, 0, { onStatus });\n"
          assert old in s, 'canvas setup block not found'
          s=s.replace(old,new,1)
          old="  try { recorder = createRecorder(stream, mimeType, bitrateFor(project)); } catch { recorder = new MediaRecorder(stream); }\n"
          new="  try { recorder = createRecorder(stream, mimeType, bitrateFor(project, exportProfile.width, exportProfile.iosSafeMode)); } catch { recorder = new MediaRecorder(stream); }\n"
          assert old in s, 'recorder bitrate call not found'
          s=s.replace(old,new,1)
          old="      resolve({ blob, mimeType: actualMime, extension, durationSec: total, diagnostics: { requestedWidth: Number(project.output?.width) || 720, requestedHeight: Number(project.output?.height) || 1280, canvasWidth: canvas.width, canvasHeight: canvas.height, captureWidth: Number(captureTrackSettings?.width) || null, captureHeight: Number(captureTrackSettings?.height) || null, captureFrameRate: Number(captureTrackSettings?.frameRate) || null, selectedMimeType: mimeType, actualMimeType: actualMime, hasAudio: Boolean(audio?.tracks?.length) } });\n"
          new="      resolve({ blob, mimeType: actualMime, extension, durationSec: total, diagnostics: { requestedWidth: exportProfile.requestedWidth, requestedHeight: exportProfile.requestedHeight, canvasWidth: canvas.width, canvasHeight: canvas.height, captureWidth: Number(captureTrackSettings?.width) || null, captureHeight: Number(captureTrackSettings?.height) || null, captureFrameRate: Number(captureTrackSettings?.frameRate) || null, selectedMimeType: mimeType, actualMimeType: actualMime, hasAudio: Boolean(audio?.tracks?.length), iosSafeMode: exportProfile.iosSafeMode } });\n"
          assert old in s, 'diagnostics resolve not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          cat > tests/iosSafeExport.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const source = fs.readFileSync(new URL('../videoRenderer.js', import.meta.url), 'utf8');
          test('iPhone export uses a 720-class safe profile', () => {
            assert.match(source, /export function resolveExportProfile/);
            assert.match(source, /const maxPixels = 720 \* 1280/);
            assert.match(source, /iPhone\|iPad\|iPod/);
            assert.match(source, /exportProfile\.iosSafeMode \? 30 : 60/);
            assert.match(source, /if \(iosSafeMode\) return 3_000_000/);
          });
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add videoRenderer.js tests/iosSafeExport.test.mjs
          git commit -m 'Add iPhone safe video export profile'
          git rm .github/workflows/patch-ios-safe-export.yml
          git commit -m 'Remove temporary iOS export patch workflow'
          git push origin HEAD:v1.4/fix-narration-performance-shorts-limit
