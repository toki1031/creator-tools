name: Patch MediaRecorder OPFS sink
on:
  push:
    branches:
      - v1.4/fix-narration-performance-shorts-limit
    paths:
      - .github/workflows/patch-mediarecorder-opfs.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4/fix-narration-performance-shorts-limit
      - name: Apply patch
        run: python .github/scripts/patch_mediarecorder_opfs.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-mediarecorder-opfs.yml
          git rm .github/scripts/patch_mediarecorder_opfs.py
          git add -A
          git commit -m "Stream MediaRecorder chunks to OPFS"
          git push origin HEAD:v1.4/fix-narration-performance-shorts-limit
