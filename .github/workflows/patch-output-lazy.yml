name: Targeted output lazy patch

on:
  push:
    branches:
      - v1.4/fix-narration-performance-shorts-limit
    paths:
      - .github/workflows/patch-output-lazy.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4/fix-narration-performance-shorts-limit
      - name: Apply exact lazy output patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('main.js')
          text = path.read_text()

          replacements = [
            (
              '<img src="${reviewImage}" alt="シーン${index+1}素材">',
              '<img src="${reviewImage}" loading="lazy" decoding="async" alt="シーン${index+1}素材">'
            ),
            (
              '<span id="renderStatus">素材準備中…</span></div><div id="assetDiagnostics" class="asset-diagnostics">素材を確認しています…</div>',
              '<span id="renderStatus">操作時に素材を準備します</span></div><div id="assetDiagnostics" class="asset-diagnostics">プレビューまたは動画生成時に素材を読み込みます。</div>'
            ),
            (
              "  let preparedPromise=prepareVideoProject(project,{onStatus:text=>renderStatus.textContent=text}).then(value=>{prepared=value;describeAssets(value);drawProjectFrame(project,prepared,canvas,0);return value;}).catch(error=>{renderStatus.textContent='素材準備エラー';diagnostics.textContent=error.message;diagnostics.classList.add('warn');throw error;});",
              "  let preparedPromise=null;\n  const ensurePreparedAssets=()=>{\n    if(prepared)return Promise.resolve(prepared);\n    if(preparedPromise)return preparedPromise;\n    renderStatus.textContent='素材を準備しています…';\n    diagnostics.textContent='必要な画像・音声を読み込んでいます…';\n    diagnostics.classList.remove('warn');\n    preparedPromise=prepareVideoProject(project,{onStatus:text=>renderStatus.textContent=text}).then(value=>{prepared=value;describeAssets(value);return value;}).catch(error=>{preparedPromise=null;renderStatus.textContent='素材準備エラー';diagnostics.textContent=error.message;diagnostics.classList.add('warn');throw error;});\n    return preparedPromise;\n  };"
            ),
            (
              "const assets=await preparedPromise;drawProjectFrame(project,assets,canvas,0);",
              "const assets=await ensurePreparedAssets();drawProjectFrame(project,assets,canvas,0);"
            ),
            (
              "const assets=await preparedPromise;await runVisualPreview(project,assets,canvas,",
              "const assets=await ensurePreparedAssets();await runVisualPreview(project,assets,canvas,"
            ),
            (
              "let assets=await preparedPromise;",
              "let assets=await ensurePreparedAssets();"
            ),
          ]

          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old[:120]}')
            text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          git commit -m "Lazy-load output media on user action"
          git push origin HEAD:v1.4/fix-narration-performance-shorts-limit
