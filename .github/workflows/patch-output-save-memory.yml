name: Patch output save memory
on:
  push:
    branches:
      - v1.4/fix-narration-performance-shorts-limit
    paths:
      - .github/workflows/patch-output-save-memory.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4/fix-narration-performance-shorts-limit
      - run: node scripts/patch-output-save-memory.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-output-save-memory.yml scripts/patch-output-save-memory.mjs
          git add -A
          git commit -m "Avoid full project save before video generation"
          git push origin HEAD:v1.4/fix-narration-performance-shorts-limit
