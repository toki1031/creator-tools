name: Patch scene narration window
on:
  push:
    branches:
      - v1.4/fix-narration-performance-shorts-limit
    paths:
      - .github/workflows/patch-scene-narration-window.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4/fix-narration-performance-shorts-limit
      - name: Patch lazy scene narration audio window
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('videoRenderer.js')
          s=p.read_text()
          old="""  const sceneNarrations = [];
  if (hasSceneNarrations) {
    onStatus('シーン別ナレーションを確認しています…');
    for (let index = 0; index < scenes.length; index++) {
      const n = scenes[index]?.narration;
      if (!n?.audioData) { sceneNarrations.push(null); continue; }
      try {
        const response = await fetch(n.audioData);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        sceneNarrations.push({
          arrayBuffer: await response.arrayBuffer(),
          mimeType: response.headers.get('content-type') || n.mimeType || 'audio/wav',
          durationSec: Number(n.durationSec) || 0
        });
      } catch (error) {
        console.warn(`Scene ${index + 1} narration load failed`, error);
        sceneNarrations.push({ error: error instanceof Error ? error.message : String(error) });
      }
      onStatus(`シーン別ナレーションを確認しています… ${index + 1}/${scenes.length}`);
    }
  }
"""
          new="""  const sceneNarrationSources = scenes.map(scene => {
    const n = scene?.narration;
    return n?.audioData ? { audioData: n.audioData, mimeType: n.mimeType || 'audio/wav', durationSec: Number(n.durationSec) || 0 } : null;
  });
  const sceneNarrations = Array(scenes.length).fill(null);
  if (hasSceneNarrations) onStatus('シーン別ナレーションは再生直前に順番に読み込みます。');
"""
          assert old in s, 'scene narration preload block not found'
          s=s.replace(old,new,1)
          old="""  return { images, imageSources, imageFailures, imageLoadPromises, imageWindowIndex: imagePreparation.imageWindowIndex, loadedImageCount, audioArrayBuffer, audioMimeType, audioFetchError, audioInvalid, narrationArrayBuffer, narrationMimeType, narrationFetchError, narrationInvalid, sceneNarrations };
"""
          new="""  return { images, imageSources, imageFailures, imageLoadPromises, imageWindowIndex: imagePreparation.imageWindowIndex, loadedImageCount, audioArrayBuffer, audioMimeType, audioFetchError, audioInvalid, narrationArrayBuffer, narrationMimeType, narrationFetchError, narrationInvalid, sceneNarrations, sceneNarrationSources };
"""
          assert old in s, 'prepare return not found'
          s=s.replace(old,new,1)
          old="""  if (expectedSceneNarration) {
    const preparedScenes = Array.isArray(prepared?.sceneNarrations) ? prepared.sceneNarrations : [];
    const failed = [];
    scenes.forEach((scene, index) => { if (scene?.narration?.audioData && !preparedScenes[index]?.arrayBuffer) failed.push(index + 1); });
    if (failed.length) errors.push(`シーン別ナレーションを読み込めませんでした（シーン${failed.join('・')}）`);
  } else if (project?.narration?.audioData && !prepared?.narrationArrayBuffer) {
"""
          new="""  if (expectedSceneNarration) {
    const sources = Array.isArray(prepared?.sceneNarrationSources) ? prepared.sceneNarrationSources : [];
    const missing = [];
    scenes.forEach((scene, index) => { if (scene?.narration?.audioData && !sources[index]?.audioData) missing.push(index + 1); });
    if (missing.length) errors.push(`シーン別ナレーションの参照を準備できませんでした（シーン${missing.join('・')}）`);
  } else if (project?.narration?.audioData && !prepared?.narrationArrayBuffer) {
"""
          assert old in s, 'validate scene narration block not found'
          s=s.replace(old,new,1)
          start=s.index('async function createAudio(project, prepared, providedContext = null) {')
          end=s.index('\nexport async function exportProjectVideo', start)
          old=s[start:end]
          new=r'''async function createAudio(project, prepared, providedContext = null) {
  const preparedErrors = validatePreparedAudioForExport(project, prepared);
  if (preparedErrors.length) throw new Error(`${preparedErrors.join('／')}。BGM・ナレーション画面で音声ファイルを確認してください。`);
  if (project.output?.bgmEnabled && (prepared.audioInvalid || bgmLooksLikeVideo(project))) throw new Error('BGMに動画ファイルが登録されています。MP3・M4A・AAC・WAVなどの音声ファイルへ差し替えてください。');
  if (prepared.narrationInvalid || narrationLooksLikeVideo(project)) throw new Error('ナレーションに動画ファイルが登録されています。MP3・M4A・AAC・WAVなどの音声ファイルへ差し替えてください。');
  const hasBgm = Boolean(project.output?.bgmEnabled && prepared.audioArrayBuffer);
  const sceneSources = Array.isArray(prepared.sceneNarrationSources) ? prepared.sceneNarrationSources : [];
  const hasSceneNarration = sceneSources.some(x => x?.audioData);
  const hasNarration = !hasSceneNarration && Boolean(prepared.narrationArrayBuffer);
  if (!hasBgm && !hasNarration && !hasSceneNarration) return { audio: null, warning: '' };
  const AudioContextClass = globalThis.AudioContext || globalThis.webkitAudioContext;
  if (!AudioContextClass) throw new Error('この端末ではBGM・ナレーション合成に必要なWeb Audioを利用できません。別の対応端末で再試行してください。');
  const context = providedContext || new AudioContextClass();
  const warnings = [];
  const staticSources = [];
  const staticStarts = [];
  try {
    if (context.state !== 'running') await context.resume();
    const destination = context.createMediaStreamDestination();
    let bgmGain = null;
    let narrationGain = null;
    let narrationDuration = 0;
    if (hasBgm) {
      try {
        const buffer = await context.decodeAudioData(prepared.audioArrayBuffer);
        prepared.audioArrayBuffer = null;
        const source = context.createBufferSource(); source.buffer = buffer; source.loop = calculateBgmLoopCount(getProjectDuration(project), buffer.duration, project.bgm?.loop !== false) > 1;
        bgmGain = context.createGain(); source.connect(bgmGain); bgmGain.connect(destination); staticStarts.push(baseTime => source.start(baseTime)); staticSources.push(source);
      } catch (error) { console.warn('BGM decode failed; continue without BGM', error, prepared.audioMimeType); warnings.push(`BGMをデコードできなかったためBGMなしで続行します${prepared.audioMimeType ? `（${prepared.audioMimeType}）` : ''}`); }
    }
    if (hasNarration) {
      try {
        const buffer = await context.decodeAudioData(prepared.narrationArrayBuffer); prepared.narrationArrayBuffer = null; narrationDuration = buffer.duration || 0;
        const source = context.createBufferSource(); source.buffer = buffer; source.loop = false; narrationGain = context.createGain(); narrationGain.gain.value = clamp(Number(project.narration?.volume ?? 1), 0, 1.5); source.connect(narrationGain); narrationGain.connect(destination); staticStarts.push(baseTime => source.start(baseTime)); staticSources.push(source);
      } catch (error) { console.warn('Narration decode failed; continue without narration', error, prepared.narrationMimeType); warnings.push(`ナレーションをデコードできなかったためナレーションなしで続行します${prepared.narrationMimeType ? `（${prepared.narrationMimeType}）` : ''}`); }
    }
    if (warnings.length) throw new Error(`${warnings.join('／')}。BGM・ナレーション画面で音声ファイルを再登録してください。`);

    const scenes = Array.isArray(project.scenes) ? project.scenes : [];
    const sceneStarts = [];
    let cursor = 0;
    for (const scene of scenes) { sceneStarts.push(cursor); cursor += Math.max(0, Number(scene?.durationSec) || 0); }
    const dynamicScenes = new Map();
    const loadingScenes = new Map();
    let started = false;
    let baseTime = 0;
    let lastProjectTime = 0;

    const decodeScene = async index => {
      if (!hasSceneNarration || index < 0 || index >= scenes.length || !sceneSources[index]?.audioData) return null;
      if (dynamicScenes.has(index)) return dynamicScenes.get(index);
      if (loadingScenes.has(index)) return await loadingScenes.get(index);
      const task = (async () => {
        const meta = sceneSources[index];
        const response = await fetch(meta.audioData);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const encoded = await response.arrayBuffer();
        const buffer = await context.decodeAudioData(encoded);
        const source = context.createBufferSource(); source.buffer = buffer; source.loop = false;
        const gain = context.createGain(); gain.gain.value = clamp(Number(project.narration?.volume ?? 1), 0, 1.5); source.connect(gain); gain.connect(destination);
        const entry = { index, source, gain, buffer, scheduled: false, duration: buffer.duration || meta.durationSec || Math.max(0, Number(scenes[index]?.durationSec) || 0) };
        dynamicScenes.set(index, entry);
        return entry;
      })().catch(error => { console.warn(`Scene ${index + 1} narration decode failed`, error, sceneSources[index]?.mimeType); throw new Error(`シーン${index + 1}のナレーションをデコードできませんでした`); }).finally(() => loadingScenes.delete(index));
      loadingScenes.set(index, task);
      return await task;
    };

    const scheduleEntry = (entry, projectTime = lastProjectTime) => {
      if (!entry || entry.scheduled || !started) return;
      const sceneStart = sceneStarts[entry.index] || 0;
      const elapsed = Math.max(0, projectTime - sceneStart);
      if (elapsed >= entry.duration) return;
      const when = context.currentTime + Math.max(0, sceneStart - projectTime);
      entry.source.start(when, elapsed);
      entry.scheduled = true;
    };

    const releaseBefore = index => {
      for (const [key, entry] of dynamicScenes) {
        if (key >= index) continue;
        try { entry.source.disconnect(); } catch {}
        try { entry.gain.disconnect(); } catch {}
        entry.source.buffer = null;
        dynamicScenes.delete(key);
      }
    };

    const primeSceneWindow = async index => {
      if (!hasSceneNarration) return;
      const targets = [index, index + 1].filter(i => i >= 0 && i < scenes.length && sceneSources[i]?.audioData);
      for (const target of targets) {
        const entry = await decodeScene(target);
        scheduleEntry(entry);
      }
      releaseBefore(Math.max(0, index - 1));
    };

    if (hasSceneNarration) await primeSceneWindow(0);
    if (!staticSources.length && !hasSceneNarration) { if (!providedContext && context.state !== 'closed') await context.close(); return { audio: null, warning: '' }; }

    return { audio: {
      context, sources: staticSources, bgmGain, narrationGain, narrationDuration, tracks: destination.stream.getAudioTracks(),
      start() { if (started) return; started = true; baseTime = context.currentTime; staticStarts.forEach(start => start(baseTime)); dynamicScenes.forEach(entry => scheduleEntry(entry, 0)); },
      update(timeSec, totalSec) {
        lastProjectTime = timeSec;
        if (hasSceneNarration) {
          let index = scenes.length - 1;
          for (let i = 0; i < sceneStarts.length; i++) { const end = sceneStarts[i] + Math.max(0, Number(scenes[i]?.durationSec) || 0); if (timeSec < end) { index = i; break; } }
          void primeSceneWindow(index).catch(error => console.warn('Scene narration window load failed', error));
        }
        if (bgmGain) {
          const base = clamp(Number(project.bgm?.volume) || 0, 0, 1); const fadeIn = Math.max(0, Number(project.bgm?.fadeInSec) || 0); const fadeOut = Math.max(0, Number(project.bgm?.fadeOutSec) || 0); let factor = 1; if (fadeIn > 0) factor = Math.min(factor, timeSec / fadeIn); if (fadeOut > 0) factor = Math.min(factor, (totalSec - timeSec) / fadeOut);
          const sceneSpeaking = [...dynamicScenes.values()].some(entry => entry.scheduled && timeSec >= (sceneStarts[entry.index] || 0) && timeSec < (sceneStarts[entry.index] || 0) + entry.duration);
          const duck = project.bgm?.ducking !== false && ((narrationGain && timeSec < narrationDuration) || sceneSpeaking) ? 0.35 : 1; bgmGain.gain.value = base * clamp(factor, 0, 1) * duck;
        }
        if (narrationGain) narrationGain.gain.value = clamp(Number(project.narration?.volume ?? 1), 0, 1.5);
        dynamicScenes.forEach(entry => { entry.gain.gain.value = clamp(Number(project.narration?.volume ?? 1), 0, 1.5); });
      },
      async stop() {
        for (const source of staticSources) { try { source.stop(); } catch {} }
        for (const entry of dynamicScenes.values()) { try { entry.source.stop(); } catch {} try { entry.source.disconnect(); } catch {} entry.source.buffer = null; }
        dynamicScenes.clear(); loadingScenes.clear();
        try { if (context.state !== 'closed') await context.close(); } catch {}
      }
    }, warning: '' };
  } catch (error) { try { if (context.state !== 'closed') await context.close(); } catch {} throw error; }
}
'''
          s=s[:start]+new+s[end:]
          p.write_text(s)

          p=Path('main.js')
          s=p.read_text()
          old="""    const preparedSceneNarrations=Array.isArray(value.sceneNarrations)?value.sceneNarrations.filter(item=>item?.arrayBuffer).length:0;
    const failedSceneNarrations=Array.isArray(value.sceneNarrations)?value.sceneNarrations.filter(item=>item?.error).length:0;
    const expectedSceneNarrations=scenes.filter(scene=>scene?.narration?.audioData).length;
    let narrationText='ナレーションなし';
    if(expectedSceneNarrations) narrationText=`シーン別ナレーション ${preparedSceneNarrations}/${expectedSceneNarrations}${failedSceneNarrations?`（読込失敗 ${failedSceneNarrations}件）`:''}`;
"""
          new="""    const preparedSceneNarrations=Array.isArray(value.sceneNarrationSources)?value.sceneNarrationSources.filter(item=>item?.audioData).length:Array.isArray(value.sceneNarrations)?value.sceneNarrations.filter(item=>item?.arrayBuffer).length:0;
    const failedSceneNarrations=Array.isArray(value.sceneNarrations)?value.sceneNarrations.filter(item=>item?.error).length:0;
    const expectedSceneNarrations=scenes.filter(scene=>scene?.narration?.audioData).length;
    let narrationText='ナレーションなし';
    if(expectedSceneNarrations) narrationText=`シーン別ナレーション ${preparedSceneNarrations}/${expectedSceneNarrations}（再生直前に読込）${failedSceneNarrations?`（読込失敗 ${failedSceneNarrations}件）`:''}`;
"""
          assert old in s, 'main diagnostics block not found'
          s=s.replace(old,new,1)
          old="""      const preparedSceneNarrations=Array.isArray(assets.sceneNarrations)?assets.sceneNarrations.filter(item=>item?.arrayBuffer).length:0;
      if((project.output?.bgmEnabled&&project.bgm?.audioData&&!assets.audioArrayBuffer)||(project.narration?.audioData&&!expectedSceneNarrations&&!assets.narrationArrayBuffer)||(expectedSceneNarrations&&preparedSceneNarrations<expectedSceneNarrations)){assets=await prepareVideoProject(project,{onStatus:text=>renderStatus.textContent=text});prepared=assets;describeAssets(assets);}
"""
          new="""      const preparedSceneNarrations=Array.isArray(assets.sceneNarrationSources)?assets.sceneNarrationSources.filter(item=>item?.audioData).length:Array.isArray(assets.sceneNarrations)?assets.sceneNarrations.filter(item=>item?.arrayBuffer).length:0;
      if((project.output?.bgmEnabled&&project.bgm?.audioData&&!assets.audioArrayBuffer)||(project.narration?.audioData&&!expectedSceneNarrations&&!assets.narrationArrayBuffer)||(expectedSceneNarrations&&preparedSceneNarrations<expectedSceneNarrations)){assets=await prepareVideoProject(project,{onStatus:text=>renderStatus.textContent=text});prepared=assets;describeAssets(assets);}
"""
          assert old in s, 'main prepared scene narration block not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Add regression tests
        run: |
          cat > tests/sceneNarrationMemory.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const renderer = fs.readFileSync(new URL('../videoRenderer.js', import.meta.url), 'utf8');
          const main = fs.readFileSync(new URL('../main.js', import.meta.url), 'utf8');

          test('scene narration preparation stores references instead of every encoded ArrayBuffer', () => {
            assert.match(renderer, /const sceneNarrationSources = scenes\.map/);
            assert.doesNotMatch(renderer, /sceneNarrations\.push\(\{\s*arrayBuffer:/);
            assert.match(renderer, /再生直前に順番に読み込みます/);
          });

          test('scene narration decode uses a current plus next window and releases old buffers', () => {
            assert.match(renderer, /const primeSceneWindow = async index/);
            assert.match(renderer, /\[index, index \+ 1\]/);
            assert.match(renderer, /releaseBefore\(Math\.max\(0, index - 1\)\)/);
            assert.match(renderer, /entry\.source\.buffer = null/);
          });

          test('normal output accepts lazy scene narration preparation', () => {
            assert.match(main, /assets\.sceneNarrationSources/);
            assert.match(main, /再生直前に読込/);
          });
          EOF
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-scene-narration-window.yml
          git add -A
          git commit -m "Stream scene narration in a small decode window"
          git push origin HEAD:v1.4/fix-narration-performance-shorts-limit
