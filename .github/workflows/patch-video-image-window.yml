name: Patch video image window
on:
  push:
    branches:
      - v1.4/fix-narration-performance-shorts-limit
    paths:
      - .github/workflows/patch-video-image-window.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4/fix-narration-performance-shorts-limit
      - name: Patch decoded image window
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('videoRenderer.js')
          s=p.read_text()

          marker="""export async function prepareVideoProject(project, { onStatus = () => {} } = {}) {\n"""
          helper="""async function loadPreparedImageAt(prepared, index) {\n  const source = prepared?.imageSources?.[index];\n  if (!source || prepared.images?.[index]) return prepared.images?.[index] || null;\n  if (prepared.imageFailures?.some(item => item.index === index)) return null;\n  prepared.imageLoadPromises ||= [];\n  if (prepared.imageLoadPromises[index]) return await prepared.imageLoadPromises[index];\n  prepared.imageLoadPromises[index] = loadImageSafely(source).then(image => {\n    prepared.images[index] = image;\n    return image;\n  }).catch(error => {\n    const message = error instanceof Error ? error.message : String(error);\n    if (!prepared.imageFailures.some(item => item.index === index)) prepared.imageFailures.push({ index, message });\n    console.warn(`Scene ${index + 1} image load failed`, error);\n    return null;\n  }).finally(() => { prepared.imageLoadPromises[index] = null; });\n  return await prepared.imageLoadPromises[index];\n}\n\nexport async function ensurePreparedImageWindow(project, prepared, index, { onStatus = () => {} } = {}) {\n  if (!Array.isArray(prepared?.imageSources) || !Array.isArray(prepared?.images)) return;\n  const scenes = Array.isArray(project?.scenes) ? project.scenes : [];\n  const current = Math.max(0, Math.min(scenes.length - 1, Number(index) || 0));\n  if (!scenes.length) return;\n  if (prepared.imageWindowIndex === current && prepared.images[current] !== undefined) return;\n  prepared.imageWindowIndex = current;\n  const keep = new Set([current, current + 1].filter(i => i >= 0 && i < scenes.length));\n  for (let i = 0; i < prepared.images.length; i++) {\n    if (!keep.has(i)) prepared.images[i] = null;\n  }\n  for (const target of keep) {\n    if (!prepared.imageSources[target]) continue;\n    onStatus(`シーン画像を準備しています… ${target + 1}/${scenes.length}`);\n    await loadPreparedImageAt(prepared, target);\n  }\n}\n\nexport function releasePreparedImages(prepared) {\n  if (!Array.isArray(prepared?.images)) return;\n  prepared.images.fill(null);\n  prepared.imageWindowIndex = -1;\n}\n\n"""
          assert marker in s, 'prepareVideoProject marker not found'
          s=s.replace(marker, helper+marker, 1)

          old="""  const imageFailures = [];\n  const images = [];\n  onStatus('シーン画像を順番に準備しています…');\n  for (let index = 0; index < scenes.length; index++) {\n    const imageSource = resolveSceneImageSource(project, scenes[index]).data;\n    if (!imageSource) {\n      images.push(null);\n      continue;\n    }\n    try {\n      images.push(await loadImageSafely(imageSource));\n    } catch (error) {\n      imageFailures.push({ index, message: error instanceof Error ? error.message : String(error) });\n      console.warn(`Scene ${index + 1} image load failed`, error);\n      images.push(null);\n    }\n    onStatus(`シーン画像を準備しています… ${index + 1}/${scenes.length}`);\n  }\n"""
          new="""  const imageFailures = [];\n  const imageSources = scenes.map(scene => resolveSceneImageSource(project, scene).data || '');\n  const images = Array(scenes.length).fill(null);\n  const imageLoadPromises = Array(scenes.length).fill(null);\n  const imagePreparation = { imageSources, images, imageFailures, imageLoadPromises, imageWindowIndex: -1 };\n  onStatus('先頭シーンの画像を準備しています…');\n  if (scenes.length) await ensurePreparedImageWindow(project, imagePreparation, 0, { onStatus });\n"""
          assert old in s, 'old all-image preload block not found'
          s=s.replace(old,new,1)

          old="""  const loadedImageCount = images.filter(Boolean).length;\n"""
          new="""  const loadedImageCount = imageSources.filter(Boolean).length;\n"""
          assert old in s, 'loadedImageCount line not found'
          s=s.replace(old,new,1)

          old="""  return { images, imageFailures, loadedImageCount, audioArrayBuffer, audioMimeType, audioFetchError, audioInvalid, narrationArrayBuffer, narrationMimeType, narrationFetchError, narrationInvalid, sceneNarrations };\n"""
          new="""  return { images, imageSources, imageFailures, imageLoadPromises, imageWindowIndex: imagePreparation.imageWindowIndex, loadedImageCount, audioArrayBuffer, audioMimeType, audioFetchError, audioInvalid, narrationArrayBuffer, narrationMimeType, narrationFetchError, narrationInvalid, sceneNarrations };\n"""
          assert old in s, 'prepare return line not found'
          s=s.replace(old,new,1)

          old="""  const local = clamp(timeSec - item.start, 0, item.duration);\n"""
          new="""  if (Array.isArray(prepared?.imageSources) && prepared.imageWindowIndex !== item.index) void ensurePreparedImageWindow(project, prepared, item.index);\n  const local = clamp(timeSec - item.start, 0, item.duration);\n"""
          assert old in s, 'drawProjectFrame insertion point not found'
          s=s.replace(old,new,1)

          old="""  canvas.width = Number(project.output?.width) || 720; canvas.height = Number(project.output?.height) || 1280;\n  drawProjectFrame(project, prepared, canvas, 0);\n"""
          new="""  canvas.width = Number(project.output?.width) || 720; canvas.height = Number(project.output?.height) || 1280;\n  await ensurePreparedImageWindow(project, prepared, 0, { onStatus });\n  drawProjectFrame(project, prepared, canvas, 0);\n"""
          assert old in s, 'export initial draw block not found'
          s=s.replace(old,new,1)

          old="""  const cleanup = async () => { cancelAnimationFrame(frameId); stream.getTracks().forEach(track => track.stop()); await audio?.stop(); try { await wakeLock?.release(); } catch {} };\n"""
          new="""  const cleanup = async () => { cancelAnimationFrame(frameId); stream.getTracks().forEach(track => track.stop()); await audio?.stop(); releasePreparedImages(prepared); try { await wakeLock?.release(); } catch {} };\n"""
          assert old in s, 'cleanup line not found'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Add regression tests
        run: |
          cat > tests/videoImageWindowMemory.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync(new URL('../videoRenderer.js', import.meta.url), 'utf8');

          test('video preparation keeps decoded images to a current plus next scene window', () => {
            assert.match(source, /export async function ensurePreparedImageWindow/);
            assert.match(source, /new Set\(\[current, current \+ 1\]/);
            assert.match(source, /if \(!keep\.has\(i\)\) prepared\.images\[i\] = null/);
            assert.doesNotMatch(source, /for \(let index = 0; index < scenes\.length; index\+\+\) \{\n    const imageSource = resolveSceneImageSource/);
          });

          test('video export primes the first image window and releases decoded images after recording', () => {
            assert.match(source, /await ensurePreparedImageWindow\(project, prepared, 0, \{ onStatus \}\)/);
            assert.match(source, /releasePreparedImages\(prepared\)/);
          });

          test('frame drawing advances image window without blocking every animation frame', () => {
            assert.match(source, /prepared\.imageWindowIndex !== item\.index\) void ensurePreparedImageWindow/);
          });
          EOF
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-video-image-window.yml
          git add -A
          git commit -m "Limit decoded video images to active scene window"
          git push origin HEAD:v1.4/fix-narration-performance-shorts-limit
