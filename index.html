<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creator Tools">
<link rel="manifest" href="manifest.webmanifest">
<title>Creator Tools v2</title>
<style>
:root{color-scheme:dark;--bg:#0b0e15;--panel:#171b27;--line:#30384d;--text:#f5f7fb;--muted:#aab1c2;--accent:#7c8cff;--accent2:#a274ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1d2548 0,transparent 34%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}
.app{max-width:850px;margin:auto}.head{display:flex;align-items:center;gap:11px;margin-bottom:16px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:24px}h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.hero{background:linear-gradient(135deg,rgba(124,140,255,.18),rgba(162,116,255,.10));border:1px solid rgba(160,170,255,.25);border-radius:22px;padding:18px;margin-bottom:13px}.hero h2{margin:0 0 7px;font-size:21px}.hero p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;padding:16px;text-align:left;min-height:145px}.tool .icon{font-size:29px}.tool h3{margin:11px 0 5px;font-size:16px}.tool p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.badge{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:999px;background:rgba(124,140,255,.14);font-size:10px;font-weight:800}.disabled{opacity:.52}
.panel{display:none}.panel.active{display:block}.back{border:1px solid var(--line);background:var(--panel);color:var(--text);min-height:42px;padding:8px 13px;border-radius:13px;font-weight:800;margin-bottom:11px}
iframe{width:100%;height:calc(100vh - 100px);border:0;border-radius:18px;background:white}
.footer{text-align:center;color:var(--muted);font-size:11px;padding:22px}
</style>
</head>
<body>
<main class="app">
<header class="head"><div class="logo">✦</div><div><h1>Creator Tools</h1><div class="sub">動画・SNS制作を、ひとつに。</div></div></header>

<section id="home">
<div class="hero"><h2>今日は何を作りますか？</h2><p>台本、ナレーション、字幕をiPhoneだけで整えられます。入力内容は端末内に保存されます。</p></div>
<div class="grid">
<button class="tool" data-tool="読み上げ"><div class="icon">🎙</div><h3>テキスト読み上げ</h3><p>声・速度・高さを調整して台本を読み上げます。</p><span class="badge">利用可能</span></button>
<button class="tool" data-tool="台本"><div class="icon">📝</div><h3>台本整形</h3><p>YouTube Shorts向けに文章を読みやすく整えます。</p><span class="badge">利用可能</span></button>
<button class="tool" data-tool="字幕"><div class="icon">✂️</div><h3>字幕分割</h3><p>長い文章を画面表示しやすい字幕へ分割します。</p><span class="badge">利用可能</span></button>
<button class="tool disabled" type="button"><div class="icon">📱</div><h3>SNS投稿</h3><p>X・Instagram向けの投稿整形機能です。</p><span class="badge">次回追加</span></button>
<button class="tool disabled" type="button"><div class="icon">🎨</div><h3>サムネ文字</h3><p>短く強いサムネ文言を作る機能です。</p><span class="badge">準備中</span></button>
<button class="tool disabled" type="button"><div class="icon">⚙️</div><h3>設定</h3><p>AI音声や保存形式を管理します。</p><span class="badge">準備中</span></button>
</div><div class="footer">Creator Tools v2</div>
</section>

<section id="toolPanel" class="panel">
<button class="back" id="back">← トップへ戻る</button>
<iframe id="toolFrame" src="app.html" title="Creator Tools"></iframe>
</section>
</main>
<script>
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  document.getElementById('home').style.display='none';
  document.getElementById('toolPanel').classList.add('active');
  setTimeout(()=>{
    const f=document.getElementById('toolFrame');
    try{
      const tabs=[...f.contentDocument.querySelectorAll('.tab')];
      const target=tabs.find(x=>x.textContent.includes(b.dataset.tool));
      if(target)target.click();
    }catch(e){}
  },500);
});
document.getElementById('back').onclick=()=>{
  document.getElementById('toolPanel').classList.remove('active');
  document.getElementById('home').style.display='block';
  window.scrollTo(0,0);
};
</script>
</body>
</html>
