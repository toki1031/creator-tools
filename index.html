<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10131c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Creator OS" />
  <title>Creator OS</title>
</head>
<body>
  <div id="app">
    <main style="min-height:100vh;display:grid;place-items:center;background:#0b0e15;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px;text-align:center">
      <div><div style="font-size:38px">✦</div><p>Creator OSを起動しています…</p></div>
    </main>
  </div>
  <script type="module" src="/main.ts"></script>
  <script>
    window.addEventListener('error', function (event) {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;background:#0b0e15;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px"><section style="max-width:620px;background:#171b27;border:1px solid #30384d;border-radius:20px;padding:20px"><h1>Creator OSを起動できませんでした</h1><p style="color:#aab1c2;line-height:1.7">JavaScriptの読み込み中に問題が発生しました。Cloudflareのデプロイログを確認してください。</p><pre style="white-space:pre-wrap;background:#0e1320;padding:12px;border-radius:12px;overflow:auto">' + String(event.message || 'Unknown error').replace(/[&<>]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]}) + '</pre></section></main>';
    });
  </script>
</body>
</html>
