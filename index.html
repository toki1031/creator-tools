<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10131c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Creator OS" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <title>Creator OS</title>
</head>
<body>
  <div id="app">
    <main class="boot"><div><div class="boot-logo">✦</div><p>Creator OSを起動しています…</p></div></main>
  </div>
  <script type="module" src="./main.js"></script>
  <script>
    window.addEventListener('error', function (event) {
      const app = document.getElementById('app');
      if (!app) return;
      const message = String(event.message || 'Unknown error').replace(/[&<>]/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]});
      app.innerHTML = '<main class="boot"><section class="boot-error"><h1>Creator OSを起動できませんでした</h1><p>ファイルの読み込みに問題が発生しました。</p><pre>' + message + '</pre><button onclick="location.reload()">再読み込み</button></section></main>';
    });
  </script>
</body>
</html>
