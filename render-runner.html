<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10131c" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./touch-targets.css" />
  <title>Creator OS 動画生成</title>
  <style>
    .render-runner{max-width:760px;margin:0 auto;padding:24px 16px 48px}.render-runner canvas{width:min(100%,360px);height:auto;display:block;margin:16px auto;background:#000;border-radius:14px}.render-runner progress{width:100%}.render-runner video{width:100%;max-height:70vh;background:#000;border-radius:14px}.render-runner .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.render-runner .notice{line-height:1.7}.render-runner [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="render-runner">
    <h1>動画生成</h1>
    <p id="renderRunnerStatus" class="notice">生成専用画面を準備しています…</p>
    <progress id="renderRunnerProgress" max="1" value="0"></progress>
    <canvas id="renderRunnerCanvas" width="720" height="1280"></canvas>
    <div class="actions">
      <button id="renderRunnerStart" type="button" class="primary" hidden>動画を生成</button>
      <button id="renderRunnerCancel" type="button" hidden>中止</button>
      <a id="renderRunnerBack" href="./index.html">Creator OSへ戻る</a>
    </div>
    <section id="renderRunnerResult" hidden>
      <h2>生成完了</h2>
      <video id="renderRunnerVideo" controls playsinline></video>
      <div class="actions">
        <a id="renderRunnerDownload" class="button primary" download>動画を保存</a>
        <button id="renderRunnerShare" type="button">共有</button>
      </div>
      <p id="renderRunnerInfo" class="notice"></p>
    </section>
  </main>
  <script type="module" src="./renderRunner.js"></script>
</body>
</html>
